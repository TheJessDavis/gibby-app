<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibby Class Manager</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E160A">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gibby">
<style>
  :root{
    --cream:#F5EFE3;--paper:#FBF7EF;--ink:#171512;--ink-soft:#5A554C;--line:#E7DECB;
    --yellow:#F7D64B;--pink:#F4A9C8;--purple:#C6B4F0;--purple-deep:#7C5CD6;--blue:#A9C7EB;
    --mint:#AFD0A6;--coral:#F2765C;--green:#3F7A32;--white:#fff;
    --t-rose:#F9DEE4;--t-lav:#E2DcF9;--t-mint:#D9EEDF;--t-peach:#FBE5CC;--t-butter:#F8EDBE;--t-blue:#DCE8F8;
    --disp:"Helvetica Neue",Arial,"Segoe UI",system-ui,sans-serif;--serif:Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--disp);color:var(--ink);
    background:radial-gradient(120% 80% at 15% 0%,#EFE7D6,transparent 60%),var(--cream);min-height:100vh}
  .app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);
    box-shadow:0 0 60px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;
    background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
  .top .brand{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .homebtn{border:none;background:var(--ink);color:#fff;border-radius:12px;width:40px;height:38px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;flex:none}
  .menu{position:fixed;top:62px;right:16px;background:var(--white);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.18);z-index:60;min-width:230px;padding:8px;border:1px solid var(--line)}
  .mwho{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;font-weight:800;font-size:13.5px}
  .mwho small{display:block;font-weight:700;font-size:11px;color:var(--ink-soft)}
  .menu button{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-weight:800;font-size:13.5px;color:var(--ink);padding:11px 12px;border-radius:11px;cursor:pointer}
  .menu button:hover{background:var(--paper)}
  .bnav{position:fixed;bottom:12px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--ink);border-radius:22px;display:flex;gap:2px;padding:7px;z-index:45;box-shadow:0 14px 30px rgba(0,0,0,.28)}
  .bnav button{position:relative;flex:1;border:none;background:none;color:rgba(255,255,255,.55);font-family:inherit;font-weight:800;cursor:pointer;padding:7px 2px 6px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bnav button .bi{font-size:17px;line-height:1}
  .bnav:has(.tour-spot){z-index:90}
  .tour-spot{position:relative;z-index:91;background:#FCD34D !important;color:#1E160A !important;border-radius:15px;box-shadow:0 0 0 4px #FFFDF8,0 0 0 8px #FCD34D;animation:tourpulse 1.1s ease-in-out infinite}
  @keyframes tourpulse{0%,100%{box-shadow:0 0 0 4px #FFFDF8,0 0 0 8px #FCD34D}50%{box-shadow:0 0 0 4px #FFFDF8,0 0 0 13px #FCD34D}}
  .bnav button .bl{font-size:9px;letter-spacing:.04em;text-transform:uppercase}
  .bnav button.on{background:rgba(255,255,255,.16);color:#fff}
  .bnav .navbadge{position:absolute;top:2px;right:14px}
  body.formopen .bnav, body.formopen #moresheet{display:none!important}
  .bsheet{position:fixed;bottom:84px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--white);border-radius:20px;padding:12px;z-index:46;box-shadow:0 18px 40px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .bsheet button{border:none;background:var(--paper);border-radius:14px;padding:12px 4px 10px;font-family:inherit;font-weight:800;font-size:10px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bsheet button .bi{font-size:19px}
  .top .who{font-size:12px;color:var(--ink-soft);font-weight:700}
  .top button.out{border:none;background:rgba(0,0,0,.06);border-radius:10px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .top .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  @media(max-width:560px){.edithint{display:none}}
  /* Desktop: the phone column becomes a centred page with a left rail for the
     navigation. Same markup everywhere; only widths and the bars move. */
  @media(min-width:900px){
    .app{max-width:1120px;box-shadow:none;background:transparent}
    .top{position:static;max-width:1120px;margin:0 auto;padding:14px 32px 0 264px;border-bottom:0;background:transparent;width:100%;box-sizing:border-box;justify-content:flex-end}
    .top .homebtn{display:none}
    .bnav .navsec{color:rgba(255,255,255,.4);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px 4px;border-top:1px solid rgba(255,255,255,.1);margin-top:6px}
    .bnav button.navsub{padding:7px 12px} .bnav button.navsub .bi{font-size:15px} .bnav button.navsub .bl{font-size:12px}
    body .view{margin-left:232px;padding:0 32px 60px;max-width:820px}
    .bnav{top:24px;bottom:auto;left:calc(50% - 560px + 20px);right:auto;width:196px;max-width:none;margin:0;flex-direction:column;gap:3px;padding:10px;border-radius:20px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:calc(100vh - 40px);overflow:auto}
    .bnav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 12px;border-radius:12px}
    .bnav button .bi{font-size:18px} .bnav button .bl{font-size:12.5px;letter-spacing:.02em;text-transform:none}
    .bnav .navbadge{top:8px;right:10px}
    .bsheet{top:24px;bottom:auto;left:calc(50% - 560px + 224px);right:auto;width:300px;max-width:none;margin:0;grid-template-columns:repeat(3,1fr)}
    body .fab{left:calc(50% - 560px + 264px);right:auto;width:756px;max-width:none;border-radius:18px 18px 0 0}
    body #todobar,body .selbar{left:calc(50% - 560px + 264px);right:auto;width:756px;max-width:none;margin:0}
    body .cal{max-width:none}
    .card,.clscard{padding:18px 20px}
    body .login-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-left:-232px}
    body.formopen .bnav{display:flex!important}
    .menu{right:calc(50% - 560px + 32px)}
  }
  @media(min-width:900px) and (max-width:1160px){
    .bnav{left:20px} .bsheet{left:224px} body .fab,body #todobar,body .selbar{left:264px;width:calc(100% - 296px);max-width:756px}
    .top{padding:14px 20px} .menu{right:20px}
  }
  .view{flex:1;padding:20px;padding-bottom:120px}
  @font-face{font-family:'Summer Fresh';src:url('/SummerFresh.ttf') format('truetype');font-display:swap}
  h2{font-size:28px;letter-spacing:-.03em;margin:6px 0 4px;font-weight:800}
  h2 em{font-family:var(--serif);font-style:italic;font-weight:600}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.4;font-weight:500}
  .tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{flex:0 1 auto;border:none;background:var(--white);padding:9px 16px;border-radius:999px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink);box-shadow:0 3px 9px rgba(0,0,0,.05)}
  .tabs button.on{background:var(--ink);color:#fff}

  .card{background:var(--white);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.05)}
  /* Colour means status, nothing else. Green: approved or done. Yellow: waiting
     on someone. Pink: needs you. Grey: past. Every other card is white. */
  #tab .card.needs{background:var(--t-rose)} #tab .card.done{background:var(--t-mint)} #tab .card.waiting{background:var(--t-butter)} #tab .card.past{background:#ECE7DC}
  .hello{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
  .hello .ava,.hello .ava-i{width:46px;height:46px;font-size:17px;vertical-align:0;margin:0;border-radius:50%}
  .helloava{position:relative;border:none;background:none;padding:0;cursor:pointer;line-height:0}
  .helloava .avaedit{position:absolute;right:-3px;bottom:-3px;font-size:11px;background:var(--white);border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .hello b{font-family:'Summer Fresh',var(--disp);font-weight:400;font-size:26px;letter-spacing:.01em;display:block;line-height:1.1}
  .hello small{font-size:12px;font-weight:700;color:var(--ink-soft)}
  #tab .clscard.cls-pending{background:var(--t-butter)}
  #tab .clscard.cls-review{background:var(--t-rose)}
  #tab .clscard.cls-approved{background:var(--t-mint)}
  #tab .clscard.cls-back{background:var(--t-rose)}
  #tab .clscard.cls-off{background:#ECE7DC}
  .clstop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  #busybar{display:none;position:fixed;top:0;left:0;right:0;height:4px;z-index:200;background:linear-gradient(90deg,#171512 0 40%,#F2C94C 40% 60%,#171512 60%);background-size:200% 100%;animation:busyslide .9s linear infinite}
  @keyframes busyslide{from{background-position:200% 0}to{background-position:0 0}}
  body.busy .btn{pointer-events:none}
  body.busy .btn.dark,body.busy .btn.green,body.busy .btn.warn{opacity:.75}
  .qhint{display:inline-block;margin:2px 0 6px}
  .qhint>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:12px;font-weight:800;color:var(--ink-soft)}
  .qhint>summary::-webkit-details-marker{display:none}
  .qhint[open]>summary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .qhint>div{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:6px 0 2px;padding:8px 10px;background:var(--cream);border-radius:10px}
  .morefold{margin:14px 0 6px}
  .morefold>summary{list-style:none;cursor:pointer;background:#EFE9DC;border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px}
  .morefold>summary::-webkit-details-marker{display:none}
  .morefold>summary small{display:block;font-weight:600;font-size:12px;color:var(--ink-soft);margin-top:2px}
  .morefold>summary::after{content:"\203A";float:right;font-size:22px;line-height:1;color:rgba(23,21,18,.45);transition:transform .15s}
  .morefold[open]>summary::after{transform:rotate(90deg)}
  .morefold>summary+*{margin-top:12px}
  .todoline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 6px;font:inherit;color:var(--ink);cursor:pointer}
  .todoline:last-child{border-bottom:0} .todoline b{flex:1;font-size:14px;line-height:1.3} .todoline>span:first-child{font-size:18px}
  .clsrow{border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--white);box-shadow:0 4px 12px rgba(0,0,0,.04)}
  #tab .clsrow.cls-approved{background:var(--t-mint)} #tab .clsrow.cls-off{background:#ECE7DC}
  #tab .clsrow.cls-pending{background:var(--t-butter)} #tab .clsrow.cls-review{background:var(--t-rose)} #tab .clsrow.cls-back{background:var(--t-rose)}
  .clsrow>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
  .clsrow>summary::-webkit-details-marker{display:none}
  .clsrow .rowt{flex:1;min-width:0}
  .clsrow .rowt b{display:block;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clsrow .rowt span{font-size:12px;color:rgba(23,21,18,.62)}
  .rowchev{font-size:22px;line-height:1;color:rgba(23,21,18,.45);transition:transform .15s;flex:none}
  .xdismiss{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:18px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:0}
  .clsrow[open]>summary .rowchev, #pastwrap[open]>summary .rowchev{transform:rotate(90deg)}
  .clsrow>.clscard, .clsrow>.card{margin:0 8px 8px;box-shadow:none}
  .foldsum{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:rgba(23,21,18,.6);padding:10px 12px;border-radius:12px;background:#EFE9DC}
  .foldsum::-webkit-details-marker{display:none}
  .clspic{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 3px 8px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.75)}
  .clspic-i{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-size:19px}
  .clswhen{font-size:12px;font-weight:800;color:rgba(23,21,18,.55)}
  .clslab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:rgba(23,21,18,.55)}
  .clsname{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:1px 0 3px}
  .card h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .card .meta{font-size:12px;color:var(--ink-soft);font-weight:700}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pill{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .pill.pend{background:#EAE0FA;color:#5B3FB0}.pill.appr{background:#DCEFD6;color:#3F7A32}
  .pill.inc{background:#FCE4CE;color:#B45309}.pill.alc{background:var(--coral);color:#fff}
  .pill.ir{background:#DCE8F5;color:#2c5b8a}

  label{display:block;font-size:12.5px;font-weight:800;margin:12px 0 6px}
  /* Section headers (the labels that sit straight under a screen's title,
     "Low enrollment (20)", "People (12)") get the app's handwritten face. */
  #tab > label{font-family:'Summer Fresh',var(--disp);font-weight:400;font-size:27px;line-height:1.1;margin:24px 0 10px;letter-spacing:.01em}
  input,select,textarea{width:100%;border:2px solid var(--line);background:var(--white);border-radius:14px;
    padding:12px 14px;font-size:14px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--purple-deep)}
  textarea{min-height:80px;resize:vertical;line-height:1.4}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--white);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin:0}
  .chk input{width:auto;margin:0;accent-color:var(--purple-deep)}
  .volbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px;font-size:12px;font-weight:700;color:#5B3FB0;line-height:1.5}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px;font-weight:800;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn{border:none;border-radius:16px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;width:100%}
  .btn.dark{background:var(--ink);color:#fff}.btn.green{background:#5a9c4d;color:#fff}
  .btn.warn{background:#fff;color:#C4442A;box-shadow:inset 0 0 0 2px rgba(242,118,92,.5)}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink)}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.35;font-weight:500}
  #tab .meta, .card .meta{font-weight:500} .meta b, .meta strong{font-weight:800}
  .clsrow .rowt span{font-weight:500} .todoline b{font-weight:700}
  .err{background:var(--coral);color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:800;margin:10px 0;display:none}
  .err.show{display:block}
  .ok-note{background:#DCEFD6;color:#2f6a26;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;margin:10px 0}
  .muted{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px}
  #toast{position:fixed;left:12px;right:12px;bottom:96px;z-index:120;max-width:440px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 40px 12px 16px;font-size:13.5px;font-weight:600;line-height:1.4;white-space:pre-line;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .18s ease-out}
  #toast button{position:absolute;top:6px;right:8px;border:0;background:none;color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:4px;opacity:.7}
  @keyframes toastin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:900px){#toast{bottom:24px;left:auto;right:32px;margin:0}}
  .photo{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:#fff;font-weight:700;font-size:13px;color:var(--ink-soft)}
  .photo img{max-width:100%;border-radius:10px;display:block}
  .fab{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;padding:14px 20px 20px;
    background:linear-gradient(180deg,transparent,var(--paper) 40%)}
  .login-wrap{min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  .login-card{background:var(--white);border-radius:24px;box-shadow:0 18px 44px rgba(30,22,10,.10);padding:26px 26px 30px;width:100%;max-width:400px}
  .logo{width:190px;height:190px;margin:-8px auto -4px}
  .logo img{width:100%;height:100%;object-fit:contain}
  .login-card h2{font-size:30px;margin:0}
  .login-card .sub{font-size:14.5px;margin:4px 0 16px}
  .roleseg{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .roleseg button{border:none;background:none;padding:9px;font-size:13.5px}
  .roleseg button.on{background:var(--ink);color:#fff;border-radius:10px;border:none}
  .flink{font-size:12.5px;color:var(--ink-soft);font-weight:800;text-decoration:underline;text-underline-offset:2px}
  .hidden{display:none!important}
  .money th,.money td{font-size:12.5px;padding:8px 0;font-variant-numeric:tabular-nums}
  .money td.num,.money th.num{text-align:right;white-space:nowrap;padding-left:10px}
  .money .pos{color:#3F7A32;font-weight:800}.money .neg{color:#B4442C;font-weight:800}
  .lg{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .lg .rk{font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .lg .nm{font-size:13px;font-weight:700;line-height:1.2}
  .lg .sub2{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  .lg .amt{text-align:right;font-variant-numeric:tabular-nums}
  .lg .amt b{font-size:14px;font-weight:800;display:block}
  .lg .amt span{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  /* season overview: one row per date, a chip per class, colour = status */
  .seasonbar{display:inline-flex;gap:4px;background:var(--white);border-radius:14px;padding:4px;margin:0 0 14px;box-shadow:0 3px 9px rgba(0,0,0,.05)}
  .seasonbar button{border:none;background:none;font-family:inherit;font-weight:800;font-size:12.5px;color:var(--ink-soft);padding:7px 15px;border-radius:11px;cursor:pointer}
  .seasonbar button.on{background:var(--ink);color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .legend i{width:9px;height:9px;border-radius:3px;flex:none}
  .st-ok{background:#3F7A32}.st-wait{background:#7C6BD6}.st-low{background:#D9932B}
  .st-off{background:#B4442C}.st-back{background:#9A9282}
  .smonth{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}

<script>

   This app renders with template strings + innerHTML, so there are no React
   components to hang componentDidCatch on. A "boundary" here is a wrapper that
   runs one section's render inside try/catch and, if it throws, paints a fallback
   into THAT SECTION'S container only. Every other section keeps working, and a
   single bad record can never blank the screen. */
let LAST_SECTION=null;                       // re-run target for the Retry button
function logClientError(section, err, extra){
  const e = err || {};
  console.error('[boundary:'+section+']', e);
  const payload = {section, message:String(e.message||e), stack:String(e.stack||''),
    path:location.pathname+location.search, email:(ME&&ME.email)||null,
    role:(ME?actingRole():null), agent:navigator.userAgent, at:new Date().toISOString(), ...(extra||{})};
  // fire-and-forget; never let reporting an error throw another one

function boundaryHTML(canRetry, e){

  return `<div class="card" style="border:2px solid #E8B4A8;background:#FDF3F0">
    <h3 style="font-size:1rem">This section could not load.</h3>
    <div class="meta" style="margin-top:4px">${why?why+' ':''}Tap Try again; if it keeps happening, tell Jess what you were doing.</div>
    ${canRetry?`<button class="btn ghost" style="margin-top:10px" onclick="retrySection()">Try again</button>`:''}
  </div>`;

/* Run a section render inside its own boundary. target = the element this section
   owns; only that element is replaced if the render fails. */
/* A section that fails because the server was mid-restart, the phone had just
   woken up, or the network blinked is retried on its own (three tries over ten
   seconds) with a "Reconnecting" note. Only a real bug shows the red card. */
let BOUNDARY_SEQ=0;
function transientError(e){
  const st=e&&e.status; const msg=String(e&&e.message||e||'');
  return !st && /fetch|load failed|network|timed out|JSON|Unexpected token/i.test(msg) || (st>=500) || st===429 || /HTTP 5\d\d/.test(msg);

async function boundary(section, target, fn, retry){
  const seq=++BOUNDARY_SEQ;
  if(retry!==false) LAST_SECTION={section, target, fn};
  for(let attempt=0; attempt<4; attempt++){
    try{
      await fn();
      return;
    }catch(e){
      if(seq!==BOUNDARY_SEQ || !$(target)) return;     // the user has moved on; drop this render quietly
      if(e && e.status===401){ ME=null; return boot(); }  // signed out: show the sign-in screen, not an error
      if(attempt<3 && transientError(e)){
        const host=$(target);
        if(host) host.innerHTML=`<div class="card" style="text-align:center"><div class="meta">Reconnecting to The Gibby\u2026</div></div>`;
        await new Promise(r=>setTimeout(r, [1500,3000,5500][attempt]));
        continue;
      }
      logClientError(section, e);
      const host=$(target);
      if(host) host.innerHTML = boundaryHTML(retry!==false, e);
      return;
    }

}

function guard(section, fn){
  return async function(...a){

      // do not report it as a bug.
      if(e && e.status===429){ alert(e.message); return; }
      logClientError(section, e); alert('That action could not be completed.\n\n'+(e&&e.message||e));

  };
}

    p.dataset.folded='1';
    const key='hint:'+head.textContent.trim().replace(/\s*\?$/,'').slice(0,60);
    let seen=false; try{ seen=!!localStorage.getItem(key); }catch(_){}
    const q=document.createElement('button'); q.type='button'; q.className='qhint'; q.textContent='?'; q.setAttribute('aria-label','What is this?');
    q.style.cssText='margin-left:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);font-weight:800;font-size:12px;line-height:1;font-family:var(--disp);cursor:pointer;vertical-align:middle;padding:0';

function padInit(){

  CT_DRAWN=false;

  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId);
    down=true; const [x,y]=pos(e); g.beginPath(); g.moveTo(x,y); g.lineTo(x+.1,y+.1); g.stroke(); CT_DRAWN=true; });
  cv.addEventListener('pointermove',e=>{ if(!down) return; const [x,y]=pos(e); g.lineTo(x,y); g.stroke(); });
  const up=e=>{ down=false; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}

    g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,600,600);
    PF_HEADSHOT_WEB=c3.toDataURL('image/jpeg',.82);
    renderProfile();
  }; img.src=e.target.result; };
  r.readAsDataURL(f);
}

/* Lift the element a tour card talks about above the dimmed overlay and ring it,

function classLastDate(c){
  const lbl=(c.sessions&&c.sessions.length)?c.sessions[c.sessions.length-1].date:c.slot_date;
  const p=parseDate(lbl); return p?new Date(seasonYearFor(p.m),p.m,p.d):null;
}
function rerunCandidates(classes){
  const today=new Date(); today.setHours(0,0,0,0);
  const norm=t=>(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const upcoming=new Set(classes.filter(c=>c.status!=='cancelled')
    .filter(c=>{const d=classLastDate(c); return d&&d>=today;}).map(c=>norm(c.title)));
  return classes
    .filter(c=>c.status==='approved'&&c.max_p>0)
    .filter(c=>{const d=classLastDate(c); return d&&d<today;})
    .filter(c=>c.enrolled>=c.max_p*0.85)
    .filter(c=>!upcoming.has(norm(c.title)))
    .sort((a,b)=>(b.enrolled/b.max_p)-(a.enrolled/a.max_p))
    .slice(0,3);

const MONIDX={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const MONNAME=['January','February','March','April','May','June','July','August','September','October','November','December'];
/* The season decides which year a month belongs to: Dec 2026 season start means
   Dec sorts (and dates) before Jan 2027, not after. */
function seasonPivot(){ const p=(window.SEASON_START||'2026-09-01').split('-'); return {y:+p[0], m:+p[1]-1}; }
function seasonYearFor(m){ const p=seasonPivot(); return m>=p.m ? p.y : p.y+1; }
function mOrd(m){ const p=seasonPivot(); return m>=p.m ? m-12 : m; }
function parseDate(s){ if(!s)return null; const p=s.split(', '); const md=(p[1]||p[0]).trim().split(' ');
  const m=MONIDX[md[0]], d=parseInt(md[1]); if(m==null||isNaN(d))return null; return {m,d}; }

/* Read-only. Every class in the season on one screen, so a scheduling decision

function classState(c){
  if(c.status==='cancelled') return ['off','cancelled'];
  if(c.status==='incomplete') return ['back','sent back'];
  if(c.status!=='approved') return ['wait','awaiting approval'];
  if(c.enrolled < (c.min_p||0)) return ['low','below minimum'];
  return ['ok','on track'];
}

  if(!months.length){ $('#tab').innerHTML='<h2>Season</h2><div class="muted">No scheduled classes yet.</div>'; return; }

  window.__cal={months,items,openByDate};
  CAL_VIEW==='season' ? renderSeason() : renderCal(CAL_M);
}

function setCalView(v){ CAL_VIEW=v; CAL_VIEW==='season'?renderSeason():renderCal(CAL_M); }
function seasonGaps(items, openByDate){
  // Planning holes inside the next ~90 days: empty months, months with no
  // kids' classes, and runs of bookable Saturdays where a room sits idle.
  const out=[];
  const today=new Date(); today.setHours(0,0,0,0);
  const horizon=new Date(+today + 90*86400000);
  const inWin=d=>d>=today&&d<=horizon;
  const dOf=(m,d)=>new Date(seasonYearFor(m),m,d);
  const act=items.filter(c=>c.status!=='cancelled');
  const dates=[];
  act.forEach(c=>{
    const ds=(c.sessions&&c.sessions.length)?c.sessions.map(s=>s.date):[c.slot_date];
    ds.forEach(lbl=>{const p=parseDate(lbl); if(p) dates.push({dt:dOf(p.m,p.d), room:c.room||'', kids:!!c.is_kids});});
  });
  const openDates=Object.keys(openByDate).map(k=>{const [m,d]=k.split('-').map(Number); return dOf(m,d);});
  const fmt=d=>MONNAME[d.getMonth()]+' '+d.getDate();
  // Saturday streaks first: the most concrete, bookable holes.
  const inPlay=new Set();
  openDates.forEach(dt=>{ if(inWin(dt)&&dt.getDay()===6) inPlay.add(+dt); });
  dates.forEach(x=>{ if(inWin(x.dt)&&x.dt.getDay()===6) inPlay.add(+x.dt); });
  const satList=[...inPlay].sort((a,b)=>a-b).map(t=>new Date(t));
  const streaks=[];
  [['','No classes at all'],['Large Room','The Large Room is empty'],['Studio','The Studio is empty']].forEach(([room,label])=>{
    const busy=new Set(dates.filter(x=>!room||x.room===room).map(x=>+x.dt));
    let run=[];
    const flush=()=>{ if(run.length>=3&&!streaks.some(s=>!s.room&&s.start===+run[0]))
      streaks.push({room,start:+run[0],line:'\ud83c\udfe0 '+label+' for '+run.length+' Saturdays in a row ('+fmt(run[0])+' to '+fmt(run[run.length-1])+').'}); run=[]; };
    satList.forEach(d=>{ if(!busy.has(+d)) run.push(d); else flush(); });
    flush();
  });
  streaks.slice(0,3).forEach(s=>out.push(s.line));
  // Month-level holes, nearest three months only.
  const monthsSet=new Set();
  dates.forEach(x=>{ if(inWin(x.dt)) monthsSet.add(x.dt.getMonth()); });
  openDates.forEach(dt=>{ if(inWin(dt)) monthsSet.add(dt.getMonth()); });
  [...monthsSet].sort((a,b)=>mOrd(a)-mOrd(b)).slice(0,3).forEach(m=>{
    const inM=dates.filter(x=>x.dt.getMonth()===m && inWin(x.dt));
    if(!inM.length) out.push('\ud83d\uddd3 '+MONNAME[m]+' has no classes yet.');
    else if(!inM.some(x=>x.kids)) out.push("\ud83e\uddd2 No kids' classes in "+MONNAME[m]+' yet.');
  });
  return out.slice(0,6);
}

      <div><b>${n('low')}</b><span>below min</span></div>
      <div><b>${n('wait')}</b><span>awaiting</span></div>
      <div><b>${n('off')}</b><span>cancelled</span></div>

      <div class="meta">Holes in the season worth filling.</div></div></div>
      ${g.map(x=>`<div class="meta" style="padding:6px 0;border-top:1px solid var(--line)">${x}</div>`).join('')}</div>`:'')(seasonGaps(items,openByDate))}
    <div class="legend">
      <span><i class="st-ok"></i>on track</span><span><i class="st-low"></i>below minimum</span>
      <span><i class="st-wait"></i>awaiting approval</span><span><i class="st-off"></i>cancelled</span>
      <span><i class="st-back"></i>sent back</span></div>
    ${body}`;
}
function renderCal(m){
  const {months,items}=window.__cal, year=seasonYearFor(m);
  const first=new Date(year,m,1).getDay(), days=new Date(year,m+1,0).getDate();
  const withCls=new Set(items.filter(c=>c.pd.m===m).map(c=>c.pd.d));
  let cells=['S','M','T','W','T','F','S'].map(x=>`<div class="cal-h">${x}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){ const has=withCls.has(d);
    cells+=`<div class="cal-d ${has?'has':''}" ${has?`onclick="calDay(${m},${d})"`:''}>${d}${has?'<i></i>':''}</div>`; }
  const idx=months.indexOf(m);
  $('#tab').innerHTML=`<div class="row"><h2 style="margin:0">${MONNAME[m]} <em>${year}</em></h2><div>
      ${idx>0?`<button class="navm" onclick="renderCal(${months[idx-1]})">‹</button>`:''}
      ${idx<months.length-1?`<button class="navm" onclick="renderCal(${months[idx+1]})">›</button>`:''}</div></div>
    <div class="seasonbar"><button onclick="setCalView('season')">Season</button>
      <button class="on" onclick="setCalView('month')">Month</button></div>
    <p class="sub">Days with classes are highlighted. Tap one.</p>
    <div class="calgrid">${cells}</div>
    <div id="agenda"><label>All ${MONNAME[m]}</label>${items.filter(c=>c.pd.m===m).sort((a,b)=>a.pd.d-b.pd.d).map(agendaRow).join('')}</div>`;
  CAL_M=m;
}

async function addPerson(){
  const email=($('#np_email').value||'').trim().toLowerCase(), msg=$('#np_msg');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    msg.textContent='Enter a real email address first. Accounts cannot be created without one.';
    $('#np_email').focus(); return;
  }
  const tmpPw=($('#np_pw')?$('#np_pw').value:'').trim();
  if(tmpPw && tmpPw.length<8){ msg.textContent='A temporary password needs at least 8 characters.'; return; }
  try{
    const body={name:($('#np_name').value||'').trim(),email,role:$('#np_role').value};
    if(tmpPw){ body.password=tmpPw; body.must_change_pw=true; }
    const r=await api('/api/users','POST',body);
    msg.textContent = tmpPw
      ? `${email} can log in with the temporary password you set (they must change it at first login).`
      : (r.action==='created'?`Invite sent to ${email}.`:`${email} already had an account; it was updated and a fresh invite sent.`);
    setTimeout(adminPeople, 1600);
  }catch(e){ msg.textContent=e.data&&e.data.error||'Could not add them. Try again.'; }
}
async function reinvite(email,name,role){
  try{ await api('/api/users','POST',{email,name,role}); alert('Fresh invite sent to '+email+'.'); }
  catch(e){ alert(e.data&&e.data.error||'Could not re-send.'); }
}

async function adminHeadshot(uid, ev){
  const f=ev.target.files[0]; if(!f) return;
  const img=new Image(); const r=new FileReader();
  r.onload=e=>{ img.onload=async()=>{
    const side=Math.min(img.width,img.height);
    if(side<HEADSHOT_MIN){ alert(`That photo is only ${side}px across; the website needs at least ${HEADSHOT_MIN}px.`); return; }
    const big=Math.min(side,HEADSHOT_MAX), c2=document.createElement('canvas'); c2.width=c2.height=big; let g=c2.getContext('2d');
    g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,big,big);
    const c1=document.createElement('canvas'); c1.width=c1.height=240; g=c1.getContext('2d');
    g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,240,240);
    const c3=document.createElement('canvas'); c3.width=c3.height=600; g=c3.getContext('2d');
    g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,600,600);
    try{ await api('/api/admin/headshot/'+uid,'POST',{headshot:c2.toDataURL('image/jpeg',.88), headshot_px:big, photo:c1.toDataURL('image/jpeg',.82), headshot_web:c3.toDataURL('image/jpeg',.82)}); }catch(e){ alert(e.message); return; }
    adminPeople();
  }; img.src=e.target.result; };
  r.readAsDataURL(f);
}

async function postRequest(notify){
  const b={title:$('#rq_title').value, when_text:$('#rq_when').value, room:$('#rq_room').value, ages:$('#rq_ages').value, notes:$('#rq_notes').value, description:$('#rq_desc').value, skills:RQ_SKILLS.slice(), kind:RQ_KIND, button_label:($('#rq_btn')?$('#rq_btn').value:'')};
  let rid;
  try{
    if(RQ_EDIT){ await api('/api/requests/'+RQ_EDIT+'/edit','POST',b); rid=RQ_EDIT; }
    else { const r=await api('/api/requests','POST',b); rid=r.id; }
    if(RQ_FILES.length) await api('/api/requests/'+rid+'/files','POST',{files:RQ_FILES});
    let emailed=0;
    if(notify){ const n=await api('/api/requests/'+rid+'/notify','POST',{}); emailed=n.emailed||0; }
    const wasEdit=!!RQ_EDIT; RQ_EDIT=null; RQ_SKILLS=[]; RQ_FILES=[]; SKILL_Q='';
    alert(notify ? (wasEdit?'Saved. ':'Posted. ')+emailed+' instructor'+(emailed===1?'':'s')+' emailed.' : (wasEdit?'Saved.':'Posted. It is on the Opportunities tab; nobody was emailed.'));
  }catch(e){ alert(e.message); return; }
  adminRequests();
}
async function reqAction(id, action){

    ROOM_PICK=null; renderInstr('open'); return;
  }
  adminRequests();
}

async function backupNow(){
  const b=event&&event.target; if(b){ b.disabled=true; b.textContent='Backing up\u2026'; }
  try{
    const r=await api('/api/admin/backup-now','POST',{});
    if(!r.started){ alert(r.error||'Could not start the backup.'); renderAdmin('connections'); return; }
    // The upload runs on the server; poll until the status card has an answer.
    for(let i=0;i<40;i++){
      await new Promise(res=>setTimeout(res,3000));
      const d=await api('/api/integrations');
      if(!d.backup_running){
        const bk=d.backup||{};
        alert(bk.ok
          ? 'Backed up.\n\n'+bk.file+'  ('+Math.round(bk.bytes/1024)+' KB)\nSaved to the Gibby Backups folder on Drive.'
            +(bk.trashed?'\n'+bk.trashed+' copy older than 30 days was cleared.':'')
          : 'Backup failed:\n\n'+(bk.error||'unknown reason'));
        renderAdmin('connections'); return;
      }
    }
    alert('Still uploading. Check the Backups card again in a minute.');
    renderAdmin('connections');
  }catch(e){ alert('Backup failed:\n\n'+e.message); renderAdmin('connections'); }
}
async function compactDb(){
  if(!confirm('Compact the database?\n\nThis removes the large images stored inside OLD audit entries and reclaims disk space. The audit history itself (what changed, when, and by whom) is kept. A verified backup from today is required.')) return;
  try{
    const r=await api('/api/admin/compact-db','POST',{});
    if(!r.started){ alert(r.error||'Could not start.'); return; }
    for(let i=0;i<40;i++){
      await new Promise(res=>setTimeout(res,3000));
      const d=await api('/api/integrations');
      if(!d.compact_running){
        const cp=d.compact||{};
        alert(cp.ok ? 'Compacted.\n\n'+Math.round(cp.before_bytes/1048576)+' MB \u2192 '+Math.round(cp.after_bytes/1048576)+' MB\n'+cp.rows_cleaned+' audit entries cleaned.'
                    : 'Compaction failed:\n\n'+(cp.error||'unknown reason'));
        renderAdmin('connections'); return;
      }
    }
    alert('Still working. Check the Backups card again shortly.'); renderAdmin('connections');
  }catch(e){ alert('Compaction failed:\n\n'+e.message); }
}

                        : '\n\nPROBLEM FOUND: the server\'s EVENTBRITE_ORG_ID is "'+r.configured_org_id+'", which is NOT one of your organizations. Fix it on Render, then retry the failed steps.')

  alert('Token works! Your Eventbrite organization(s):\n\n'+(list||'(none found)')+match);
}

    .venue{font-size:15px;margin-top:10px;color:#4A4032}</style></head><body>

/* Every image the app stores is downscaled in the browser first. A phone photo
   or a Canva export is 5-15MB, which bloats the database and makes the public
   Art Workshops page crawl on mobile. Re-encoding to a sensible size is
   invisible to whoever is uploading and permanent once done. */
function shrinkImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Could not read that file.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => resolve(fr.result);   // not decodable: keep the original
      img.onload = () => {
        try{
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          if(scale === 1 && fr.result.length < 900000) return resolve(fr.result);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);   // JPEG has no transparency
          cx.drawImage(img, 0, 0, w, h);
          const out = cv.toDataURL('image/jpeg', quality || 0.82);
          resolve(out.length < fr.result.length ? out : fr.result);
        }catch(_){ resolve(fr.result); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------------- optimistic UI + pending lock ----------------
   The click locks the button immediately, before the request goes out, so a
   double-tap cannot fire twice. The server-side compare-and-swap and the
   publishing_in_progress flag are the real guards; this is the fast feedback. */
function btnFrom(ev){ return ev && (ev.currentTarget || (ev.target && ev.target.closest && ev.target.closest('button'))) || null; }
function lockButton(btn, label){
  if(!btn) return null;
  const restore = {html: btn.innerHTML, disabled: btn.disabled};
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>${esc(label)}`;
  // lock every sibling action on the same card so nothing else fires mid-flight
  const card = btn.closest('.card');
  const others = card ? [...card.querySelectorAll('button')].filter(b=>b!==btn && !b.disabled) : [];
  others.forEach(b=>b.disabled=true);
  return ()=>{ btn.innerHTML=restore.html; btn.disabled=restore.disabled; others.forEach(b=>b.disabled=false); };
}

const PUB_ICON = {done:'✓', failed:'⚠', skipped:'–', queued:'…', running:'…'};
function pubRowsHTML(platforms){
  if(!platforms.length) return '<div class="meta">Nothing queued yet.</div>';
  return platforms.map(p=>{
    const waiting = p.status==='queued'||p.status==='running';
    const detail = p.status==='failed' ? `<span class="er">${esc(p.error||'failed')}</span>`
      : p.status==='skipped' ? `<span class="meta">${esc(p.error||'not connected')}</span>`
      : p.status==='done' ? '' : `<span class="meta">${p.attempts?`retrying (attempt ${p.attempts+1})`:'waiting'}</span>`;
    return `<div class="pubrow ${waiting?'wait':''}"><span class="ic">${PUB_ICON[p.status]||'·'}</span>
      <b>${esc(p.label)}</b> ${detail}</div>`;
  }).join('');
}

/* Poll until the queue drains, then leave the final per-platform result on screen. */
let POLLS = {}, ADMIN_TAB=null;
let DRAFT_ID=null, PENDING_DRAFT=null;   // draft being edited / waiting for a new slot
async function pollPublish(id, tries){
  const host = $('#pubstat'+id);
  if(!host) return;                                  // card re-rendered; stop quietly
  let r;
  try{ r = await api(`/api/classes/${id}/publish-status`); }
  catch(_){ return; }
  if(!$('#pubstat'+id)) return;
  const failed = r.platforms.filter(p=>p.status==='failed');
  $('#pubstat'+id).innerHTML =
    `<div class="meta" style="font-weight:800">${r.publishing ? 'Publishing…'
      : failed.length ? `${failed.length} step${failed.length===1?' needs':'s need'} attention`
      : 'All steps finished'}</div>` + pubRowsHTML(r.platforms);
  if(r.publishing && tries > 0){
    POLLS[id] = setTimeout(()=>pollPublish(id, tries-1), 2000);
  } else {
    delete POLLS[id];
    // Refresh the approvals queue so the finished card moves on, but only if that
    // is the tab the admin is actually looking at. Never yank them somewhere else.
    if(!r.publishing && ADMIN_TAB==='approvals'){
      setTimeout(()=>{ if(ADMIN_TAB==='approvals' && $('#pubstat'+id)) adminApprovals(); }, 2500);
    }
  }
}
function startPublishPolling(id){
  clearTimeout(POLLS[id]);
  pollPublish(id, 40);                               // ~80s of live updates, then it settles
}

/* If another admin decided first the server answers 409 with a friendly line.
   Show exactly that and refresh the queue so the stale card disappears. */
async function decideClass(id, path, body){
  try{
    await api(`/api/classes/${id}/${path}`,'POST',body);
  }catch(e){
    if(e.data && e.data.status){ alert(e.message); adminApprovals(); return false; }
    throw e;
  }
  adminApprovals(); return true;
}
async function approve(id, ev){
  // Approve builds the poster; it does NOT post to the platforms (that is Publish).
  const undo = lockButton(btnFrom(ev), 'Building the poster…');
  try{
    const ok = await decideClass(id,'approve');
    if(!ok && undo) undo();
  }catch(e){ if(undo) undo(); throw e; }
}
async function publishClass(id, ev){
  if(!confirm('Publish this class? It goes public on Eventbrite, the website, and the calendar.')) return;
  const undo = lockButton(btnFrom(ev), 'Publishing to all platforms…');
  const host = $('#pubstat'+id);
  if(host) host.innerHTML = '<div class="meta" style="font-weight:800">Publishing…</div>';
  try{
    await api('/api/classes/'+id+'/publish','POST',{});
  }catch(e){
    if(undo) undo();
    if(e.data && e.data.status){ alert(e.message); return adminApprovals(); }
    throw e;
  }

async function saveSessions(id){
  const c=(window.__classes||[]).find(x=>x.id===id)||{};
  const keep=[...document.querySelectorAll('.e_sess:checked')].map(x=>x.value);
  const skip=(c.sessions||[]).map(s=>s.date).filter(d=>!keep.includes(d));
  if(!skip.length) return alert('Untick the date to skip first.');
  if(!confirm(`Skip ${skip.join(', ')} and add ${skip.length} make-up week${skip.length===1?'':'s'} at the end?`)) return;
  try{
    const r=await api('/api/classes/'+id+'/sessions','POST',{skip, notify_students: !!(document.getElementById('e_sess_notify')&&document.getElementById('e_sess_notify').checked)});
    alert(`Dates updated: ${r.sessions.map(s=>s.date).join(', ')}.\nEventbrite: ${r.eventbrite}. Calendar: ${r.calendar}.${r.emailed?' '+r.emailed+' students emailed.':''}`);
    c.sessions=r.sessions; c.session_count=r.sessions.length; openLiveEdit(id);
  }catch(e){ showErr('eerr',(e.data&&e.data.error)||e.message); }
}

function shrinkImage(file, maxSide, quality){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, maxSide/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', quality)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('That file is not an image the browser can read.')); };
    img.src=url; });
}
async function uploadPhotos(id, sfx, forThanks){
  sfx=sfx||'';
  const inp=$('#pf'+id+sfx+(forThanks?'t':'')), st=$('#pfstat'+id+sfx); const files=[...inp.files].slice(0,forThanks?5:12);
  if(!files.length) return;
  const photos=[];
  for(let i=0;i<files.length;i++){
    st.textContent='Preparing photo '+(i+1)+' of '+files.length+'…';
    try{ photos.push({name:files[i].name, mime:'image/jpeg', b64:await shrinkImage(files[i],1600,0.85), thumb:await shrinkImage(files[i],320,0.7), social:await shrinkImage(files[i],1000,0.8)}); }
    catch(e){ st.textContent=e.message; return; }
  }
  st.textContent='Sending '+photos.length+' photo'+(photos.length===1?'':'s')+' to Drive…';
  let r; try{ r=await api('/api/classes/'+id+'/photos','POST',{photos, for_thanks:!!forThanks}); }catch(e){ st.textContent='Upload failed: '+e.message; return; }
  st.textContent=(r.saved||[]).length+' saved.'+((r.failed||[]).length?' Could not save: '+r.failed.join('; '):'');
  photosInner(id, sfx);
}

function tmin(t){ const m=(t||'').trim().match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m)return 0; let h=+m[1]%12; if(/pm/i.test(m[3]))h+=12; return h*60 + +m[2]; }
/* The class length is never typed: it IS the gap between the class start and end
   the instructor picked, so the two can never contradict each other. Phrasing

function lengthPhrase(mins){
  if(mins<=0) return '';
  if(mins<60) return mins+' minutes';

/* Month calendar for picking a class date: one real month at a time, paged with
   arrows. Days with open times are green and tappable (the little number is how
   many 30-minute times are free); everything else is dimmed. Tapping a day shows
   its times below. */
function calendarPickerHTML(slots){
  const byDay={}; slots.forEach(s=>{ (byDay[s.date]=byDay[s.date]||[]).push(s); });
  const months=[...new Set(Object.keys(byDay).map(d=>parseDate(d)).filter(Boolean).map(p=>p.m))]
    .sort((a,b)=>mOrd(a)-mOrd(b));
  if(!months.length) return '<div class="muted">No open days right now.</div>';
  let m=CAL_PAGE;
  if(m===null || !months.includes(m)){
    const sd=parseDate(SLOTDAY);
    m = (sd && months.includes(sd.m)) ? sd.m : months[0];
  }
  const y=seasonYearFor(m), idx=months.indexOf(m);
  const openByNum={};
  Object.keys(byDay).forEach(d=>{ const p=parseDate(d); if(p && p.m===m) openByNum[p.d]={label:d, n:byDay[d].length}; });
  const lead=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="calday"></div>';
  for(let d=1;d<=dim;d++){
    const o=openByNum[d];
    cells += o
      ? `<button class="calday has ${o.label===SLOTDAY?'on':''}" onclick="pickDay('${o.label}')"><span>${d}</span><small>${o.n}</small></button>`
      : `<div class="calday off"><span>${d}</span></div>`;
  }
  return `<div class="cal">
    <div class="calhead">
      <button class="calnav" ${idx===0?'disabled':''} onclick="setCalPage(${idx===0?m:months[idx-1]})" aria-label="earlier month">‹</button>
      <div class="calmon">${MONNAME[m]} ${y}</div>
      <button class="calnav" ${idx===months.length-1?'disabled':''} onclick="setCalPage(${idx===months.length-1?m:months[idx+1]})" aria-label="later month">›</button>
    </div>
    ${months.length>1?`<div class="calmonths">${months.map(mm=>`<button class="${mm===m?'on':''}" onclick="setCalPage(${mm})">${MONNAME[mm].slice(0,3)} ’${String(seasonYearFor(mm)).slice(2)}</button>`).join('')}</div>`:''}
    <div class="caldow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="calgrid">${cells}</div>
    <div class="callegend">Green days have open times. Tap one to see them.</div>
  </div>`;
}

function rbDelivery(v){ RB_DELIV=v; document.querySelectorAll('#rb_deliv button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); const a=$('#rb_addrwrap'); if(a) a.classList.toggle('hidden', v!=='Mailed'); }
function rbLines(){ return [...document.querySelectorAll('#rb_lines .rbline')].map(r=>({date:r.querySelector('.rb_date').value, category:r.querySelector('.rb_cat').value, amount:+r.querySelector('.rb_amt').value||0})); }
function rbCalc(){ const sub=rbLines().reduce((s,x)=>s+x.amount,0); const adv=+($('#rb_adv')&&$('#rb_adv').value)||0; const t=$('#rb_total'); if(t) t.textContent='$'+Math.max(0,sub-adv).toFixed(2); }

async function rbPickFiles(ev){

  } else {
    // Tap a start, tap an end: everything between fills in, as long as the whole
    // stretch is open with no busy gap. A tap across a gap starts fresh instead.
    const sel=SEL.map(x=>DAYSLOTS.find(y=>y.id===x)).sort((a,b)=>tmin(a.start)-tmin(b.start));
    const lo=Math.min(tmin(sel[0].start), tmin(s.start));
    const hi=Math.max(tmin(sel[sel.length-1].end), tmin(s.end));
    const range=DAYSLOTS.filter(x=>x.room===s.room && tmin(x.start)>=lo && tmin(x.end)<=hi)
                        .sort((a,b)=>tmin(a.start)-tmin(b.start));
    const contiguous = range.length>0
      && tmin(range[0].start)===lo && tmin(range[range.length-1].end)===hi
      && range.every((x,i)=>i===0 || tmin(range[i-1].end)===tmin(x.start));
    SEL = contiguous ? range.map(x=>x.id) : [id];

}

async function dropSession(label){

/* Which day the class is over: the last session for a course, the day itself
   otherwise. Labels carry no year, so the year comes from sort_key (first
   session) and rolls over if a course runs past December. */
function classEndKey(c){
  const last = c.is_series&&c.sessions&&c.sessions.length ? c.sessions[c.sessions.length-1].date : (c.slot_date||'');
  const m=(last||'').match(/([A-Z][a-z]{2}) (\d+)/), sk=c.sort_key||'';
  if(!m || MONIDX[m[1]]==null || !sk) return sk;
  let y=+sk.slice(0,4); const mo=MONIDX[m[1]];
  if(mo < +sk.slice(5,7)-1) y+=1;
  return `${y}-${String(mo+1).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
}

async function resumeDraft(id){
  let d;
  try{ ({draft:d} = await api('/api/drafts/'+id)); }
  catch(e){ alert(e.message); return renderInstr('mine'); }
  const p = d.payload || {};
  if(!d.slots_available){
    alert('The time you had picked has since been booked by someone else.\n\n'
        + 'Your writing is safe. Choose a new time and it will be filled back in.');
    PENDING_DRAFT = {id:d.id, payload:p};   // re-applied once a new slot is chosen
    DRAFT_ID = d.id;
    return renderInstr('open');
  }
  DRAFT_ID = d.id;
  let sessions = (p.sessions && p.sessions.length) ? p.sessions : null;
  if(d.is_series && !sessions){
    // Older drafts saved the first week only: ask the server which weeks the run lands on.
    try{
      const firstIds = (p.first_ids && p.first_ids.length) ? p.first_ids : (d.slot_ids||[]);
      const r = await api('/api/series-preview','POST',{slot_ids:firstIds, weeks:d.session_count||2, skip:p.skip_dates||[]});
      if(r.sessions && r.sessions.length) sessions = r.sessions;
    }catch(_){}
    if(!sessions){
      alert('This course draft needs its dates picked again. Your writing is safe and will be filled back in.');
      PENDING_DRAFT = {id:d.id, payload:p}; return renderInstr('open');
    }
  }
  openForm({date:d.slot_date, room:d.room, start:(d.slot_time||'').split(' – ')[0],
            end:(d.slot_time||'').split(' – ')[1], time:d.slot_time, ids:(sessions?sessions[0].slot_ids:null)||d.slot_ids,
            series:!!d.is_series, weeks:sessions?sessions.length:d.session_count,
            sessions, skip:p.skip_dates||[]}, p);
}

function fmtT(m){ let h=Math.floor(m/60), mm=m%60; const ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+String(mm).padStart(2,'0')+' '+ap; }
function timeOpts(ws, we, which){
  const a=tmin(ws), b=tmin(we);
  // suggest 30 min inside each end when there is room for a real class between
  const defStart = (b-a>=90) ? a+30 : a;
  const defEnd   = (b-a>=90) ? b-30 : b;
  let out='';
  for(let m=a; m<=b; m+=30){
    const sel = (which==='start' ? m===defStart : m===defEnd) ? ' selected' : '';
    out+=`<option${sel}>${fmtT(m)}</option>`;
  }
  return out;
}

async function videoPick(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(f.size > 80*1024*1024){ alert('That video is '+Math.round(f.size/1048576)+'MB; the limit is 80MB. Trim it or export it smaller.'); return; }
  const st=$('#vstat'); st.textContent='Uploading your video\u2026 ('+Math.round(f.size/1048576)+'MB, this can take a minute)';
  try{
    const r=await fetch('/api/upload-video',{method:'POST',
      headers:{'X-CSRF-Token':CSRF,'Content-Type':f.type||'video/mp4'}, body:f});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'upload failed');
    VIDEO_URL=j.url; videoStatus();
  }catch(e){ st.textContent=''; alert('Could not upload the video.\n\n'+e.message); }
}

const KID_AGES=['Ages 2–4','Ages 5–7','Ages 8–10','Ages 8–12','Ages 11–14','Elementary Students','Middle School Students'];
function selectedAges(){ return [...document.querySelectorAll('#f_ages input:checked')].map(x=>x.value); }
/* Mirrors age_label() on the server so the instructor sees the exact phrase that
   will appear on Eventbrite and the poster, not the raw checkbox list. */
function ageBounds(s){
  if(!s) return null;
  if(/^all/i.test(s.trim())) return [0,200];
  const n=(s.match(/\d+/g)||[]).map(Number);
  if(!n.length) return null;
  if(s.includes('+')) return [n[0],200];
  return n.length>1?[n[0],n[1]]:[n[0],n[0]];
}
function ageLabel(list){
  if(!list.length) return '';
  if(list.some(a=>/^all/i.test(a))) return 'All ages';
  const named=list.filter(a=>!ageBounds(a));
  const spans=list.map(ageBounds).filter(Boolean).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(!spans.length) return named.join(', ');
  const m=[spans[0].slice()];
  for(const [lo,hi] of spans.slice(1)){
    if(lo<=m[m.length-1][1]+1) m[m.length-1][1]=Math.max(m[m.length-1][1],hi);
    else m.push([lo,hi]);
  }
  return ['Ages '+m.map(([lo,hi])=>hi>=200?`${lo}+`:(lo===hi?`${lo}`:`${lo}–${hi}`)).join(' & ')].concat(named).join(', ');
}

function materialsPerStudent(plan){
  if(studentsBring()) return 0;
  const own=$('#f_own')&&$('#f_own').checked;
  if(own) return +$('#c_mat').value||0;
  return Math.ceil(suppliesTotal()/Math.max(1,plan)*100)/100;
}
function calc(dir){
  if(dir) CALC_DIR=dir;
  if(!$('#c_plan')) return;
  const plan=Math.max(1,+$('#c_plan').value||1);
  const own=$('#f_own') && $('#f_own').checked;
  const mat=materialsPerStudent(plan);
  const reimb = own ? mat*plan : 0;             // instructor providing materials -> reimbursed
  const free=$('#f_free') && $('#f_free').checked;
  const om=$('#o_m'); if(om) om.textContent=money(mat);
  const note=$('#matnote');
  const bring=studentsBring();
  if(note) note.textContent = bring
    ? 'Students bring their own materials, so nothing is built into the ticket and nothing is ordered.'
    : own
    ? `You're providing materials, so ${money(reimb)} (materials for ${plan} students) is added to your pay.`
    : (suppliesTotal()>0 ? `${money(suppliesTotal())} of supplies across ${plan} students is ${money(mat)} per student, built into the ticket.`
                         : 'Add at least one link with a price and quantity, tick the box if you are buying the supplies yourself, or say students bring their own.');
  const ml=$('#matline');
  if(ml) ml.innerHTML = bring
    ? `Materials: students bring their own. <a href="#" onclick="openMoreDetails('#f_bring');return false">Change</a>`
    : own
    ? `Materials: you are buying them (${money(mat)} per student, reimbursed). <a href="#" onclick="openMoreDetails('#f_own');return false">Change</a>`
    : (suppliesTotal()>0 ? `Materials: ${validSupplies().length} item${validSupplies().length===1?'':'s'}, ${money(suppliesTotal())} total, ${money(mat)} per student. <a href="#" onclick="openMoreDetails('#f_supplies');return false">Edit</a>`
                         : `<b>Materials needed:</b> add supply links, tick that you are buying them yourself, or that students bring their own. <a href="#" onclick="openMoreDetails('#f_supplies');return false">Add supplies</a>`);
  const fn=$('#freenote');
  if(fn){
    fn.style.display = free ? '' : 'none';
    fn.textContent = free
      ? (own ? `Thank you! Ticket sales go to The Gibby. You are still reimbursed ${money(reimb)} for the materials you provide.`
             : 'Thank you! All ticket sales for this class go to The Gibby.')
      : '';
  }
  if($('#f_pay')) $('#f_pay').disabled = !!free;
  if($('#c_pps')) $('#c_pps').disabled = !!free;
  if(free){
    if($('#c_pps')) $('#c_pps').value = 0;
    const ticket=+$('#f_ticket').value||0;
    if($('#f_pay')){ $('#f_pay').value = Math.round(reimb); delete $('#f_pay').dataset.t; }
    $('#o_t').textContent=money(ticket); $('#o_p').textContent=money(reimb);
    const lab=$('#o_tlab');
    if(lab && lab.firstChild && lab.firstChild.nodeType===3) lab.firstChild.textContent='Your ticket';
    return;
  }
  let ticket, pps;
  const donation=$('#f_donate')&&$('#f_donate').checked;
  if(donation){
    pps=+$('#c_pps').value||0;
    const yourPay=pps*plan+reimb;
    if($('#f_ticket')) $('#f_ticket').value='';
    $('#o_t').textContent='Pay what you want'; $('#o_p').textContent=money(yourPay);
    const lab=$('#o_tlab'); if(lab && lab.firstChild && lab.firstChild.nodeType===3) lab.firstChild.textContent='Ticket';
    if($('#f_pay') && !$('#f_pay').dataset.t) $('#f_pay').value=Math.round(yourPay);
    return;
  }
  if(CALC_DIR==='ticket'){
    // They typed a ticket price: work back what it pays per student.
    ticket = +$('#f_ticket').value||0;
    pps = Math.max(0, (ticket-mat)*0.6);
    if($('#c_pps')) $('#c_pps').value=Math.round(pps*100)/100;
  } else {
    // They said what they hope to make per student: the ticket generates from it.
    pps = +$('#c_pps').value||0;
    ticket = Math.ceil(mat + pps/0.6);
    if($('#f_ticket')) $('#f_ticket').value=ticket;
  }
  const yourPay = pps*plan + reimb;
  if($('#c_pay')) $('#c_pay').value = Math.round(pps*plan);
  $('#o_t').textContent=money(ticket); $('#o_p').textContent=money(yourPay);
  const lab=$('#o_tlab');
  if(lab) lab.firstChild && lab.firstChild.nodeType===3
    ? lab.firstChild.textContent=(CALC_DIR==='ticket'?'Your ticket':'Recommended ticket')
    : null;
  if($('#f_pay') && !$('#f_pay').dataset.t)$('#f_pay').value=Math.round(yourPay);
}

function validateForm(){
  /* Each missing item carries the element to mark and jump to, so a failed submit
     lands the instructor ON the gap instead of a list at the top of the page. */
  const miss=[];
  const num=id=>{ const v=$('#'+id).value; return v.trim()===''?null:+v; };
  const add=(sel,label,short)=>miss.push({sel,label,short});
  if(!$('#f_title').value.trim()) add('#f_title','Class title','title');
  if($('#f_summary') && !$('#f_summary').value.trim()) add('#f_summary','A one-line teaser','teaser');
  const dw=wordCount($('#f_desc').value);
  if(dw<40) add('#f_desc','Description (at least 40 words'+(dw?', currently '+dw:'')+')','description');
  else if(dw>75) add('#f_desc','Description (75 words maximum, currently '+dw+')','description');
  if(!$('#f_len').value) add('#f_cend','Class start and end times','class times');
  const cs2=$('#f_cstart'), ce2=$('#f_cend');
  if(cs2 && ce2 && tmin(cs2.value) >= tmin(ce2.value))
    add('#f_cend','Class end time must be after it starts','class times');
  if(selectedAges().length===0) add('#f_ages','At least one age range','ages');
  if(!PHOTO) add('#f_photo','A class photo','photo');
  const max=num('f_max'), min=num('f_min');
  if(!(max>0)) add('#f_max','Max students','max');
  if(!(min>0)) add('#f_min','Min students','min');
  if(max>0 && min>0 && min>max) add('#f_min','Min students can’t be more than Max','min vs max');
  if(studentsBring()){
    if(!($('#f_bringlist')&&$('#f_bringlist').value.trim())) add('#f_bringlist','What students should bring','materials');
  } else if($('#f_own')&&$('#f_own').checked){
    const mat=num('c_mat');
    if(mat===null || mat<0) add('#c_mat','Your estimated supply cost per student','materials');
  } else if(!validSupplies().length){
    add('#f_supplies','Supply links with a price and quantity, or tick that you are buying them yourself, or that students bring their own','supplies');
  }
  const ticket=num('f_ticket'), pay=num('f_pay');
  const donation=$('#f_donate')&&$('#f_donate').checked;
  if(!donation && !(ticket>0)) add('#f_ticket','Ticket price','ticket');
  if(!($('#f_free')&&$('#f_free').checked) && !(pay>0)) add('#f_pay','Your pay','pay');
  return miss;
}

let PREV_CLASSES=[];
async function loadPrevOptions(){
  try{
    const {classes} = await api('/api/classes/mine');
    const seen=new Set(); PREV_CLASSES=[];
    classes.forEach(c=>{ if(!seen.has(c.title)){ seen.add(c.title); PREV_CLASSES.push(c); } });
    const sel=$('#f_prev');
    if(sel && PREV_CLASSES.length){
      sel.innerHTML='<option value="">Pick one&hellip;</option>'
        + PREV_CLASSES.map((c,i)=>`<option value="${i}">${esc(c.title)}</option>`).join('');
    } else if(sel){ sel.closest('div').style.display='none'; }
  }catch(_){/* the picker is a convenience; the form works without it */}
}
function applyPrev(){
  const i=$('#f_prev').value; if(i==='') return;
  const c=PREV_CLASSES[+i]; if(!c) return;
  applyDraft(c);                       // same keys as a draft payload
  updateTodo();

async function saveDraft(silent){

    slot_ids: payload.slot_ids, slot_date: payload.slot_date,
    slot_time: SUBMIT_SLOT.time, room: payload.room,
    is_series: payload.is_series, session_count: payload.session_count});
  DRAFT_ID = r.id;

  showReview();
}
/* The last look before it goes to The Gibby: everything they are agreeing to on
   one card. Only reachable once the form is complete. */
function showReview(){
  const f = collectForm();
  const when = SUBMIT_SLOT.series
    ? `${SUBMIT_SLOT.weeks} weeks &middot; ${esc(SUBMIT_SLOT.sessions[0].date)} &ndash; ${esc(SUBMIT_SLOT.sessions[SUBMIT_SLOT.sessions.length-1].date)}`
    : esc(SUBMIT_SLOT.date);
  const planned = +$('#c_plan').value || f.max_p;
  const mat = (+f.material_cost||0), tk = (+f.ticket_price||0);
  const pool = Math.max(0, tk*planned - mat*planned);
  const earn = f.waives_pay
    ? `${money(f.instructor_pay)} \u00b7 you're donating your time${f.own_materials?' (materials reimbursed)':''} \u2764\ufe0f`
    : f.pay_model==='split'
    ? `about ${money0(pool*0.6 + (f.own_materials?mat*planned:0))} at ${planned} booked (60% of sales)`
    : `${money(f.instructor_pay)} flat`;
  const m = document.createElement('div'); m.id='rvmodal';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML = `<div style="background:#FFFDF8;border-radius:18px;max-width:420px;width:100%;padding:20px 22px">
    <h2 style="margin:0 0 2px">One last <em>look</em></h2>
    <p class="sub" style="margin:0 0 12px">This is what The Gibby reviews and what students will see.</p>
    <div class="rvrow"><b>Class</b><span>${esc(f.title)}</span></div>
    <div class="rvrow"><b>When</b><span>${when} &middot; class ${esc(f.class_start)} &ndash; ${esc(f.class_end)}</span></div>
    <div class="rvrow"><b>Room</b><span>${esc(f.room)} &middot; booked ${esc(SUBMIT_SLOT.start)} &ndash; ${esc(SUBMIT_SLOT.end)}</span></div>
    <div class="rvrow"><b>Ages</b><span>${esc(ageLabel(selectedAges()))}</span></div>
    <div class="rvrow"><b>Students</b><span>${f.min_p} to ${f.max_p}${f.close_days?` &middot; registration closes ${f.close_days} day${f.close_days===1?'':'s'} before`:''}</span></div>
    <div class="rvrow"><b>Ticket</b><span>${money(f.ticket_price)}${f.own_materials?` &middot; you supply materials (${money(f.material_cost)}/student, reimbursed)`:` &middot; materials ${money(f.material_cost)}/student`}</span></div>
    <div class="rvrow"><b>Supplies</b><span>${f.students_bring?'Students bring their own':f.own_materials?'You are buying them':`${(f.supply_links||[]).filter(x=>x.url).length} link${(f.supply_links||[]).filter(x=>x.url).length===1?'':'s'}, ${money((f.supply_links||[]).reduce((s,x)=>s+x.price*x.qty,0))} for The Gibby to buy`}</span></div>
    <div class="rvrow"><b>You earn</b><span>${earn}</span></div>
    <div class="two" style="margin-top:16px">
      <button class="btn ghost" onclick="closeReview()">Keep editing</button>
      <button class="btn dark" onclick="submitClassNow()">Yes, submit it</button></div></div>`;
  m.addEventListener('click', e=>{ if(e.target===m) closeReview(); });
  document.body.appendChild(m);
}
function closeReview(){ const m=$('#rvmodal'); if(m) m.remove(); }
async function submitClassNow(){
  closeReview();
  const body = {...collectForm(), draft_id: DRAFT_ID || undefined};
  try{ await api('/api/classes','POST',body); SEL=[]; DRAFT_ID=null; renderInstr('mine'); }
  catch(e){
    const msg=(e.data&&e.data.fields?('Missing: '+e.data.fields.join(', ')):e.message)||'Something went wrong. Please try again.';
    const x=$('#ferr'); x.textContent=msg; x.classList.add('show');
    // Say it out loud too: on a phone the banner sits above the fold and a
    // silent failure looks like the button did nothing.
    alert("Not submitted yet: "+msg);
    x.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
