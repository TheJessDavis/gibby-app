<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gibby Class Manager</title>
<style>
  :root{
    --cream:#F5EFE3;--paper:#FBF7EF;--ink:#171512;--ink-soft:#5A554C;--line:#E7DECB;
    --yellow:#F7D64B;--pink:#F4A9C8;--purple:#C6B4F0;--purple-deep:#7C5CD6;--blue:#A9C7EB;
    --mint:#AFD0A6;--coral:#F2765C;--green:#3F7A32;--white:#fff;
    --t-rose:#F9DEE4;--t-lav:#E2DcF9;--t-mint:#D9EEDF;--t-peach:#FBE5CC;--t-butter:#F8EDBE;--t-blue:#DCE8F8;
    --disp:"Helvetica Neue",Arial,"Segoe UI",system-ui,sans-serif;--serif:Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--disp);color:var(--ink);
    background:radial-gradient(120% 80% at 15% 0%,#EFE7D6,transparent 60%),var(--cream);min-height:100vh}
  .app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);
    box-shadow:0 0 60px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;
    background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
  .top .brand{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .homebtn{border:none;background:var(--ink);color:#fff;border-radius:12px;width:40px;height:38px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;flex:none}
  .menu{position:fixed;top:62px;right:16px;background:var(--white);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.18);z-index:60;min-width:230px;padding:8px;border:1px solid var(--line)}
  .menu .mwho{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;font-weight:800;font-size:13.5px}
  .menu .mwho small{display:block;font-weight:700;font-size:11px;color:var(--ink-soft)}
  .menu button{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-weight:800;font-size:13.5px;color:var(--ink);padding:11px 12px;border-radius:11px;cursor:pointer}
  .menu button:hover{background:var(--paper)}
  .bnav{position:fixed;bottom:12px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--ink);border-radius:22px;display:flex;gap:2px;padding:7px;z-index:45;box-shadow:0 14px 30px rgba(0,0,0,.28)}
  .bnav button{position:relative;flex:1;border:none;background:none;color:rgba(255,255,255,.55);font-family:inherit;font-weight:800;cursor:pointer;padding:7px 2px 6px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bnav button .bi{font-size:17px;line-height:1}
  .bnav button .bl{font-size:9px;letter-spacing:.04em;text-transform:uppercase}
  .bnav button.on{background:rgba(255,255,255,.16);color:#fff}
  .bnav .navbadge{position:absolute;top:2px;right:14px}
  body.formopen .bnav, body.formopen #moresheet{display:none!important}
  .bsheet{position:fixed;bottom:84px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--white);border-radius:20px;padding:12px;z-index:46;box-shadow:0 18px 40px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .bsheet button{border:none;background:var(--paper);border-radius:14px;padding:12px 4px 10px;font-family:inherit;font-weight:800;font-size:10px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bsheet button .bi{font-size:19px}
  .top .who{font-size:12px;color:var(--ink-soft);font-weight:700}
  .top button.out{border:none;background:rgba(0,0,0,.06);border-radius:10px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .top .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  @media(max-width:560px){.edithint{display:none}}
  .view{flex:1;padding:20px;padding-bottom:120px}
  h2{font-size:28px;letter-spacing:-.03em;margin:6px 0 4px;font-weight:800}
  h2 em{font-family:var(--serif);font-style:italic;font-weight:600}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.4}
  .tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{flex:0 1 auto;border:none;background:var(--white);padding:9px 16px;border-radius:999px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink);box-shadow:0 3px 9px rgba(0,0,0,.05)}
  .tabs button.on{background:var(--ink);color:#fff}

  .card{background:var(--white);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.05)}
  #tab>.card:nth-of-type(5n+1){background:var(--t-rose)}
  #tab>.card:nth-of-type(5n+2){background:var(--t-lav)}
  #tab>.card:nth-of-type(5n+3){background:var(--t-mint)}
  #tab>.card:nth-of-type(5n+4){background:var(--t-peach)}
  #tab>.card:nth-of-type(5n){background:var(--t-blue)}
  .hello{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
  .hello .ava,.hello .ava-i{width:46px;height:46px;font-size:17px;vertical-align:0;margin:0;border-radius:50%}
  .helloava{position:relative;border:none;background:none;padding:0;cursor:pointer;line-height:0}
  .helloava .avaedit{position:absolute;right:-3px;bottom:-3px;font-size:11px;background:var(--white);border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .hello b{font-size:20px;letter-spacing:-.02em;display:block;line-height:1.15}
  .hello small{font-size:12px;font-weight:700;color:var(--ink-soft)}
  #tab .clscard.cls-pending{background:var(--yellow)}
  #tab .clscard.cls-review{background:var(--purple)}
  #tab .clscard.cls-approved{background:#B9E2AE}
  #tab .clscard.cls-back{background:var(--pink)}
  #tab .clscard.cls-off{background:#E9E4D8}
  .clstop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .clspic{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 3px 8px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.75)}
  .clspic-i{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-size:19px}
  .clswhen{font-size:12px;font-weight:800;color:rgba(23,21,18,.55)}
  .clslab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:rgba(23,21,18,.55)}
  .clsname{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:1px 0 3px}
  .card h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .card .meta{font-size:12px;color:var(--ink-soft);font-weight:700}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pill{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .pill.pend{background:#EAE0FA;color:#5B3FB0}.pill.appr{background:#DCEFD6;color:#3F7A32}
  .pill.inc{background:#FCE4CE;color:#B45309}.pill.alc{background:var(--coral);color:#fff}
  .pill.ir{background:#DCE8F5;color:#2c5b8a}

  label{display:block;font-size:12.5px;font-weight:800;margin:12px 0 6px}
  input,select,textarea{width:100%;border:2px solid var(--line);background:var(--white);border-radius:14px;
    padding:12px 14px;font-size:14px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--purple-deep)}
  textarea{min-height:80px;resize:vertical;line-height:1.4}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--white);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin:0}
  .chk input{width:auto;margin:0;accent-color:var(--purple-deep)}
  .volbox{background:#EAE0FA;border-radius:12px;padding:11px 13px;margin-top:10px;font-size:12px;font-weight:700;color:#5B3FB0;line-height:1.5}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px;font-weight:800;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn{border:none;border-radius:16px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;width:100%}
  .btn.dark{background:var(--ink);color:#fff}.btn.green{background:#5a9c4d;color:#fff}
  .btn.warn{background:#fff;color:#C4442A;box-shadow:inset 0 0 0 2px rgba(242,118,92,.5)}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink)}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.35}
  .err{background:var(--coral);color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:800;margin:10px 0;display:none}
  .err.show{display:block}
  .ok-note{background:#DCEFD6;color:#2f6a26;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;margin:10px 0}
  .muted{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px}
  .photo{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:#fff;font-weight:700;font-size:13px;color:var(--ink-soft)}
  .photo img{max-width:100%;border-radius:10px;display:block}
  .fab{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;padding:14px 20px 20px;
    background:linear-gradient(180deg,transparent,var(--paper) 40%)}
  .login-wrap{min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  .login-card{background:var(--white);border-radius:24px;box-shadow:0 18px 44px rgba(30,22,10,.10);padding:26px 26px 30px;width:100%;max-width:400px}
  .logo{width:190px;height:190px;margin:-8px auto -4px}
  .logo img{width:100%;height:100%;object-fit:contain}
  .login-card h2{font-size:30px;margin:0}
  .login-card .sub{font-size:14.5px;margin:4px 0 16px}
  .roleseg{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .roleseg button{border:none;background:none;padding:9px;font-size:13.5px}
  .roleseg button.on{background:var(--ink);color:#fff;border-radius:10px;border:none}
  .flink{font-size:12.5px;color:var(--ink-soft);font-weight:800;text-decoration:underline;text-underline-offset:2px}
  .hidden{display:none!important}
  .money th,.money td{font-size:12.5px;padding:8px 0;font-variant-numeric:tabular-nums}
  .money td.num,.money th.num{text-align:right;white-space:nowrap;padding-left:10px}
  .money .pos{color:#3F7A32;font-weight:800}.money .neg{color:#B4442C;font-weight:800}
  .lg{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .lg .rk{font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .lg .nm{font-size:13px;font-weight:700;line-height:1.2}
  .lg .sub2{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  .lg .amt{text-align:right;font-variant-numeric:tabular-nums}
  .lg .amt b{font-size:14px;font-weight:800;display:block}
  .lg .amt span{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  /* season overview: one row per date, a chip per class, colour = status */
  .seasonbar{display:inline-flex;gap:4px;background:var(--white);border-radius:14px;padding:4px;margin:0 0 14px;box-shadow:0 3px 9px rgba(0,0,0,.05)}
  .seasonbar button{border:none;background:none;font-family:inherit;font-weight:800;font-size:12.5px;color:var(--ink-soft);padding:7px 15px;border-radius:11px;cursor:pointer}
  .seasonbar button.on{background:var(--ink);color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
  .legend i{width:9px;height:9px;border-radius:3px;flex:none}
  .st-ok{background:#3F7A32}.st-wait{background:#7C6BD6}.st-low{background:#D9932B}
  .st-off{background:#B4442C}.st-back{background:#9A9282}
  .smonth{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}
  .srow{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
  .sdate{font-weight:800;font-size:12.5px;line-height:1.25;color:var(--ink)}
  .sdate small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .schips{display:flex;flex-direction:column;gap:5px}
  .schip{display:grid;grid-template-columns:4px 1fr auto;gap:8px;align-items:center;background:var(--white);border-radius:9px;padding:7px 9px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .schip .bar{width:4px;height:100%;min-height:24px;border-radius:3px}
  .schip .t{font-size:12.5px;font-weight:700;line-height:1.25}
  .schip .r{font-size:10.5px;font-weight:700;color:var(--ink-soft)}
  .schip .n{font-size:10.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  .sfree{font-size:11px;font-weight:700;color:var(--ink-soft);font-style:italic;padding:3px 0}
  .stotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
  .stotals div{background:var(--white);padding:10px 11px}
  .stotals b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .stotals span{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
  .cal-h{text-align:center;font-size:10px;font-weight:800;color:var(--ink-soft)}
  .cal-d{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);gap:3px}
  .cal-d.has{background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.06);color:var(--ink);cursor:pointer}
  .cal-d.has i{width:5px;height:5px;border-radius:50%;background:var(--coral)}
  .navm{border:none;background:rgba(0,0,0,.06);border-radius:10px;padding:6px 13px;font-weight:800;cursor:pointer;margin-left:6px;color:var(--ink)}
  .poster{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;margin-top:10px;background-size:cover;background-position:center;background-color:#b9a48a;box-shadow:0 8px 20px rgba(0,0,0,.15)}
  .poster-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px;color:#fff}
  .poster .p-title{font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:-.01em;margin-top:auto;text-shadow:-1.5px -1.5px 0 #182742,1.5px -1.5px 0 #182742,-1.5px 1.5px 0 #182742,1.5px 1.5px 0 #182742,0 2px 5px rgba(0,0,0,.45)}
  .poster .p-script{font-family:"Snell Roundhand","Brush Script MT",cursive;font-size:30px;margin-top:4px;text-shadow:-1px -1px 0 #182742,1px -1px 0 #182742,-1px 1px 0 #182742,1px 1px 0 #182742}
  .poster .p-when{margin-top:18px}
  .poster .p-day,.poster .p-time,.poster .p-ages{font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .poster .p-day{font-size:15px}.poster .p-time{font-size:14px;margin-top:2px}.poster .p-ages{font-size:15px;margin-top:14px}
  .poster .p-logos{margin-top:auto;font-size:8px;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .calc{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-top:8px}
  .calc .o{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}
  .calc .o:last-child{border-bottom:none}.calc .o b{font-weight:800}.calc .o .hero{color:var(--yellow);font-size:16px}
  /* pop-out style month calendar for picking a class date */
  .cal{background:var(--white);border-radius:20px;padding:14px 14px 10px;box-shadow:0 3px 9px rgba(0,0,0,.05);margin:0 0 14px;max-width:420px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .calmon{font-weight:800;font-size:16px}
  .calnav{border:none;background:var(--paper);width:34px;height:34px;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;color:var(--ink);line-height:1}
  .calnav:disabled{opacity:.25;cursor:default}
  .caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
  .caldow div{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .calday{position:relative;aspect-ratio:1;border:none;border-radius:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;background:none;color:var(--ink)}
  .calday.off{color:var(--ink-soft);opacity:.32;font-weight:600}
  .calday.has{background:#EAF4E2;cursor:pointer;color:var(--ink)}
  .calday.has small{font-size:8.5px;font-weight:800;color:#3F7A32;line-height:1;margin-top:1px}
  .calday.on{background:var(--ink);color:#fff}
  .calday.on small{color:rgba(255,255,255,.75)}
  .callegend{font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:8px}
  .calmonths{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
  .calmonths button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-family:inherit;font-weight:800;font-size:11px;color:var(--ink);cursor:pointer}
  .calmonths button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .dayhead{font-weight:800;font-size:14px;margin:0 0 10px}
  .roomcard{display:block;width:100%;border:none;border-radius:22px;padding:26px 22px;margin:0 0 12px;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(0,0,0,.08)}
  .roomcard b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .roomcard span{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .rc-lav{background:var(--purple)}
  .rc-mint{background:#B9E2AE}
  .roombar{display:inline-flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:0 0 12px;box-shadow:0 3px 9px rgba(0,0,0,.05)}
  .roombar b{color:var(--ink)}
  .roombar a{color:var(--ink);font-weight:800}
  .ava{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:-7px;margin-right:7px}
  .ava-i{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:800;vertical-align:-7px;margin-right:7px}
  .ava-big{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block}
  .ava-big-i{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--ink);color:#fff;font-size:32px;font-weight:800}
  .edithint{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--ink-soft);border:1.5px solid var(--line);border-radius:8px;padding:2px 7px;margin-left:7px;text-transform:uppercase}
  .skillcloud{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
  .skill{display:inline-flex;align-items:center;gap:5px;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
  .skill.mine{background:var(--ink);border-color:var(--ink);color:#fff}
  .skill.mini{padding:3px 9px;font-size:10.5px;cursor:default;background:#EAF4E2;border-color:#EAF4E2;color:#3F7A32}
  .skill.mini.hit{background:var(--ink);border-color:var(--ink);color:#fff}

<script>
const $ = s => document.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
/* The access token lasts 8 hours. When it expires the server answers 401; we spend
   the 30-day refresh token once to get a new pair and replay the request. The
   refresh is shared between concurrent calls so a burst of requests triggers one
   rotation, not several (each rotation invalidates the last). */
/* CSRF: the server hands us a per-session token in the response body (never a
   cookie, so it cannot be sent automatically by a cross-site request). We keep it
   in memory and echo it on every state-changing call. */
let CSRF = null;
function noteCsrf(j){ if(j && j.csrf_token) CSRF = j.csrf_token; }

let REFRESHING = null;
function refreshSession(){
  if(!REFRESHING){
    REFRESHING = fetch('/api/refresh',{method:'POST'})
      .then(async r=>{ if(r.ok) noteCsrf(await r.json().catch(()=>({}))); return r.ok; })
      .catch(()=>false)
      .finally(()=>{ setTimeout(()=>{ REFRESHING=null; }, 0); });
  }
  return REFRESHING;
}
const NO_REFRESH = ['/api/login','/api/refresh','/api/logout','/api/me'];
async function api(path, method='GET', body, _retried){
  const headers = body ? {'Content-Type':'application/json'} : {};
  if(method !== 'GET' && CSRF) headers['X-CSRF-Token'] = CSRF;
  const r = await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(r.status===401 && !_retried && !NO_REFRESH.includes(path)){
    if(await refreshSession()) return api(path, method, body, true);
  }
  const j = await r.json().catch(()=>({}));
  // Token went stale (session rotated in another tab): re-sync once and retry.
  if(r.status===403 && j.csrf && !_retried){
    const me = await fetch('/api/me').then(x=>x.json()).catch(()=>null);
    if(me && me.csrf_token){ noteCsrf(me); return api(path, method, body, true); }
  }
  noteCsrf(j);
  if(!r.ok) throw Object.assign(new Error(j.error||'error'), {data:j, status:r.status,
    retryAfter: r.headers.get('Retry-After')});
  return j;
}
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$'+(Math.round((+n||0)*100)/100).toLocaleString();

let ME=null, VIEWAS=null, LOGIN_CHOICE=null, SLOTDAY=null;

/* ---------------- error boundaries ----------------
   This app renders with template strings + innerHTML, so there are no React
   components to hang componentDidCatch on. A "boundary" here is a wrapper that
   runs one section's render inside try/catch and, if it throws, paints a fallback
   into THAT SECTION'S container only. Every other section keeps working, and a
   single bad record can never blank the screen. */
let LAST_SECTION=null;                       // re-run target for the Retry button
function logClientError(section, err, extra){
  const e = err || {};
  console.error('[boundary:'+section+']', e);
  const payload = {section, message:String(e.message||e), stack:String(e.stack||''),
    path:location.pathname+location.search, email:(ME&&ME.email)||null,
    role:(ME?actingRole():null), agent:navigator.userAgent, at:new Date().toISOString(), ...(extra||{})};
  // fire-and-forget; never let reporting an error throw another one
  try{ fetch('/api/client-error',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload), keepalive:true}).catch(()=>{}); }catch(_){}
}
function boundaryHTML(canRetry){
  return `<div class="card" style="border:2px solid #E8B4A8;background:#FDF3F0">
    <h3 style="font-size:1rem">This section failed to load.</h3>
    <div class="meta" style="margin-top:4px">Try refreshing, or contact support.</div>
    ${canRetry?`<button class="btn ghost" style="margin-top:10px" onclick="retrySection()">Try again</button>`:''}
  </div>`;
}
/* Run a section render inside its own boundary. target = the element this section
   owns; only that element is replaced if the render fails. */
async function boundary(section, target, fn, retry){
  if(retry!==false) LAST_SECTION={section, target, fn};
  try{
    await fn();
  }catch(e){
    logClientError(section, e);
    const host=$(target);
    if(host) host.innerHTML = boundaryHTML(retry!==false);
  }
}
function retrySection(){ if(LAST_SECTION) boundary(LAST_SECTION.section, LAST_SECTION.target, LAST_SECTION.fn); }
/* Wrap a click handler so a failed action reports itself instead of dying silently
   as an unhandled rejection. Does not replace any UI. */
function guard(section, fn){
  return async function(...a){
    try{ return await fn.apply(this, a); }
    catch(e){
      // A rate-limit reply is already a clear, friendly sentence; show it as-is and
      // do not report it as a bug.
      if(e && e.status===429){ alert(e.message); return; }
      logClientError(section, e); alert('That action could not be completed.\n\n'+(e&&e.message||e));
    }
  };
}
/* Last-resort nets: anything that escapes a boundary still gets reported. */
window.addEventListener('error', ev=>logClientError('window.onerror', ev.error||{message:ev.message}));
window.addEventListener('unhandledrejection', ev=>logClientError('unhandledrejection', ev.reason||{message:'unhandled rejection'}));

function showErr(id,msg){ const x=$('#'+id); if(x){x.textContent=msg; x.classList.add('show');} }
function actingRole(){ return (ME && ME.role==='admin') ? (VIEWAS||'admin') : (ME?ME.role:null); }
function switchMode(){ VIEWAS = (VIEWAS==='admin'?'instructor':'admin'); boot(); }
// The top-level boundary. If startup itself fails (e.g. /api/me is unreachable),
// the user gets the fallback instead of a blank white page.
function boot(){ return boundary('boot', '#view', bootInner); }
async function bootInner(){
  const params=new URLSearchParams(location.search);
  if(params.get('reset')){ $('#top').style.display='none'; return renderReset(params.get('reset')); }
  const me0 = await api('/api/me');
  let user = me0.user;
  window.SEASON_START = me0.season_start || '2026-09-01';
  // Access token gone but the refresh cookie may still be good (e.g. reopening the
  // app the next morning). Spend it once before falling back to the login screen.
  if(!user && await refreshSession()){ user = (await api('/api/me')).user; }
  ME=user;
  if(!user){ renderLogin(); $('#top').style.display='none'; return; }
  if(user.must_change_pw){ $('#top').style.display='flex'; hideBnav(); return renderChangePw(); }
  $('#top').style.display='flex';
  if(LOGIN_CHOICE && user.role==='admin') VIEWAS = LOGIN_CHOICE;   // honor the sign-in choice (admins only)
  else if(VIEWAS===null) VIEWAS = user.role;
  LOGIN_CHOICE=null;
  const sb=$('#switchbtn');
  // The purple button states the CURRENT view (tap to flip); the name carries no
  // role text, so nothing in the header says the same thing twice.
  if(user.role==='admin'){ sb.style.display='inline-block'; sb.textContent = (VIEWAS==='admin'?'Admin':'Instructor')+' \u21c4'; sb.title='Switch to '+(VIEWAS==='admin'?'instructor':'admin')+' view'; }
  else sb.style.display='none';
  $('#m_who').innerHTML = avaHTML(user) + `<span>${esc(user.name)}<small>${esc(user.email||'')}</small></span>`;
  if(actingRole()==='admin') renderAdmin('dashboard'); else renderInstr('open');
}
function renderChangePw(){
  $('#view').innerHTML=`<div class="login-wrap">
    <h2>Welcome! <em>Set up your account</em></h2>
    <p class="sub">Enter your name and choose your own password to continue.</p>

}
async function submitChangePw(){
  const name=$('#np_name').value.trim(), a=$('#np1').value, b=$('#np2').value;

}

  return `<span class="${cls}">${esc(init)}</span>`;
}

  // clay & sculpture

function renderProfile(){

let CT_DRAWN=false;
function padInit(){
  const cv=$('#ct_pad'); if(!cv) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  g.lineWidth=2.5; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#171512';
  CT_DRAWN=false;
  let down=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId);
    down=true; const [x,y]=pos(e); g.beginPath(); g.moveTo(x,y); g.lineTo(x+.1,y+.1); g.stroke(); CT_DRAWN=true; });
  cv.addEventListener('pointermove',e=>{ if(!down) return; const [x,y]=pos(e); g.lineTo(x,y); g.stroke(); });
  const up=e=>{ down=false; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}
function padClear(){
  const cv=$('#ct_pad'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height); CT_DRAWN=false;
}

/* ---------------- calendar ---------------- */
const MONIDX={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const MONNAME=['January','February','March','April','May','June','July','August','September','October','November','December'];
/* The season decides which year a month belongs to: Dec 2026 season start means
   Dec sorts (and dates) before Jan 2027, not after. */
function seasonPivot(){ const p=(window.SEASON_START||'2026-09-01').split('-'); return {y:+p[0], m:+p[1]-1}; }
function seasonYearFor(m){ const p=seasonPivot(); return m>=p.m ? p.y : p.y+1; }
function mOrd(m){ const p=seasonPivot(); return m>=p.m ? m-12 : m; }
function parseDate(s){ if(!s)return null; const p=s.split(', '); const md=(p[1]||p[0]).trim().split(' ');
  const m=MONIDX[md[0]], d=parseInt(md[1]); if(m==null||isNaN(d))return null; return {m,d}; }
let CAL_M=0;
/* Read-only. Every class in the season on one screen, so a scheduling decision
   can be made without clicking through months. */
let CAL_VIEW='season';
function classState(c){
  if(c.status==='cancelled') return ['off','cancelled'];
  if(c.status==='incomplete') return ['back','sent back'];
  if(c.status!=='approved') return ['wait','awaiting approval'];
  if(c.enrolled < (c.min_p||0)) return ['low','below minimum'];
  return ['ok','on track'];
}
async function adminCalendar(){
  const [{classes}, slotsRes] = await Promise.all([api('/api/classes/all'), api('/api/slots')]);
  const items=classes.map(c=>({...c,pd:parseDate(c.slot_date)})).filter(c=>c.pd);
  const months=[...new Set(items.map(c=>c.pd.m))].sort((a,b)=>mOrd(a)-mOrd(b));
  if(!months.length){ $('#tab').innerHTML='<h2>Season</h2><div class="muted">No scheduled classes yet.</div>'; return; }
  if(!months.includes(CAL_M)) CAL_M=months[0];
  // dates that still have unclaimed slots: the gaps you can actually fill
  const openByDate={};
  (slotsRes.slots||[]).forEach(sl=>{ const d=parseDate(sl.date); if(d) openByDate[d.m+'-'+d.d]=(openByDate[d.m+'-'+d.d]||0)+1; });
  window.__cal={months,items,openByDate};
  CAL_VIEW==='season' ? renderSeason() : renderCal(CAL_M);
}
async function daySheet(label){
  const {classes} = await api('/api/classes/all');
  const todays = classes.filter(c => c.status!=='cancelled' &&
    (c.slot_date===label || (c.sessions||[]).some(x=>x.date===label)));
  const blocks = [];
  for (const c of todays){
    let regs=[];
    try{ ({registrations:regs} = await api('/api/class/'+c.id+'/registrations')); }catch(_){/* sheet still prints */}
    regs = regs.filter(r=>!r.refunded);
    blocks.push(`<div class="card">
      <div class="row"><div><h3>${esc(c.title)}</h3>
        <div class="meta">class ${esc(c.class_time||c.slot_time||'')} &middot; room booked ${esc(c.slot_time||'')} &middot; ${esc(c.room||'')}</div>
        <div class="meta">${esc(c.instructor_name)} &middot; ${regs.length} of ${c.max_p} booked${c.is_series?` &middot; ${c.session_count}-week course`:''}</div></div>
        ${c.status!=='approved'?`<span class="pill pend">not confirmed &middot; ${esc(c.status.replace('_',' '))}</span>`:''}</div>
      ${regs.map(r=>`<div class="sheetrow"><span class="bx"></span>
        <span>${esc(r.name)}</span><span class="em">${esc(r.phone||r.email||'')}</span></div>`).join('')
        || '<div class="muted" style="margin-top:8px">No one booked yet.</div>'}
    </div>`);
  }
  $('#tab').innerHTML = `<h2>${esc(label)} <em>day sheet</em></h2>
    <p class="sub noprint">Check-in boxes for the door. Print it and clip it to the desk.</p>
    <div class="two noprint" style="margin-bottom:14px">
      <button class="btn ghost" onclick="renderAdmin('calendar')">Back to the season</button>
      <button class="btn dark" onclick="window.print()">Print</button></div>
    ${blocks.join('') || '<div class="muted">No classes on this day.</div>'}`;
}
function setCalView(v){ CAL_VIEW=v; CAL_VIEW==='season'?renderSeason():renderCal(CAL_M); }
function renderSeason(){
  const {items,openByDate}=window.__cal;
  const n = st => items.filter(c=>classState(c)[0]===st).length;
  // group by month, then by date
  const byMonth={};
  items.slice().sort((a,b)=>mOrd(a.pd.m)-mOrd(b.pd.m) || a.pd.d-b.pd.d)
       .forEach(c=>{ (byMonth[c.pd.m]=byMonth[c.pd.m]||{})[c.pd.d]=(byMonth[c.pd.m][c.pd.d]||[]).concat(c); });
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const body=Object.keys(byMonth).map(Number).sort((a,b)=>mOrd(a)-mOrd(b)).map(m=>`
    <div class="smonth">${esc(MONNAME[m])}</div>
    ${Object.keys(byMonth[m]).map(Number).sort((a,b)=>a-b).map(d=>{
      const list=byMonth[m][d], open=openByDate[m+'-'+d]||0;
      const rooms=new Set(list.map(c=>c.room).filter(Boolean));
      const dow=(list[0].slot_date||'').includes(', ') ? list[0].slot_date.split(', ')[0]
                                                       : DOW[new Date(seasonYearFor(m),m,d).getDay()];
      return `<div class="srow">
        <div class="sdate">${d}<small>${esc(dow)}</small>
          <button class="dslink noprint" onclick="daySheet('${esc(list[0].slot_date)}')">day sheet</button></div>
        <div class="schips">
          ${list.map(c=>{const [st,label]=classState(c);return `<div class="schip">
            <div class="bar st-${st}"></div>
            <div><div class="t">${esc(c.title)}</div>
              <div class="r">${esc(c.room||'room not set')} &middot; ${esc(c.slot_time||'')} &middot; ${esc(label)}</div></div>
            <div class="n">${c.enrolled}/${c.max_p}</div></div>`;}).join('')}
          ${open?`<div class="sfree">${open} slot${open===1?'':'s'} still open${rooms.size===1?' in the other room':''}</div>`:''}
        </div></div>`;}).join('')}`).join('');
  $('#tab').innerHTML = `<h2>The <em>season</em></h2>
    <p class="sub">Every class, both rooms, whole season. Read-only.</p>
    <div class="seasonbar">
      <button class="on" onclick="setCalView('season')">Season</button>
      <button onclick="setCalView('month')">Month</button></div>
    <div class="stotals">
      <div><b>${items.length}</b><span>classes</span></div>
      <div><b>${n('ok')}</b><span>on track</span></div>
      <div><b>${n('low')}</b><span>below min</span></div>
      <div><b>${n('wait')}</b><span>awaiting</span></div>
      <div><b>${n('off')}</b><span>cancelled</span></div>
      <div><b>${n('back')}</b><span>sent back</span></div>
    </div>
    <div class="legend">
      <span><i class="st-ok"></i>on track</span><span><i class="st-low"></i>below minimum</span>
      <span><i class="st-wait"></i>awaiting approval</span><span><i class="st-off"></i>cancelled</span>
      <span><i class="st-back"></i>sent back</span></div>
    ${body}`;
}
function renderCal(m){
  const {months,items}=window.__cal, year=seasonYearFor(m);
  const first=new Date(year,m,1).getDay(), days=new Date(year,m+1,0).getDate();
  const withCls=new Set(items.filter(c=>c.pd.m===m).map(c=>c.pd.d));
  let cells=['S','M','T','W','T','F','S'].map(x=>`<div class="cal-h">${x}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){ const has=withCls.has(d);
    cells+=`<div class="cal-d ${has?'has':''}" ${has?`onclick="calDay(${m},${d})"`:''}>${d}${has?'<i></i>':''}</div>`; }
  const idx=months.indexOf(m);
  $('#tab').innerHTML=`<div class="row"><h2 style="margin:0">${MONNAME[m]} <em>${year}</em></h2><div>
      ${idx>0?`<button class="navm" onclick="renderCal(${months[idx-1]})">‹</button>`:''}
      ${idx<months.length-1?`<button class="navm" onclick="renderCal(${months[idx+1]})">›</button>`:''}</div></div>
    <div class="seasonbar"><button onclick="setCalView('season')">Season</button>
      <button class="on" onclick="setCalView('month')">Month</button></div>
    <p class="sub">Days with classes are highlighted. Tap one.</p>
    <div class="calgrid">${cells}</div>
    <div id="agenda"><label>All ${MONNAME[m]}</label>${items.filter(c=>c.pd.m===m).sort((a,b)=>a.pd.d-b.pd.d).map(agendaRow).join('')}</div>`;
  CAL_M=m;
}
function calDay(m,d){ const {items}=window.__cal; const list=items.filter(c=>c.pd.m===m&&c.pd.d===d);
  $('#agenda').innerHTML=`<label>${MONNAME[m]} ${d}</label>`+list.map(agendaRow).join(''); }
function agendaRow(c){ const pill=c.status==='approved'?'appr':c.status==='cancelled'?'inc':'pend';
  return `<div class="card"><div class="row"><h3>${esc(c.title)}</h3><span class="pill ${pill}">${esc(c.status)}</span></div>
    <div class="meta">${esc(c.instructor_name)} · ${esc(c.slot_date)} ${esc(c.slot_time||'')} · ${esc(c.room||'')}</div></div>`; }

async function addPerson(){
  const email=($('#np_email').value||'').trim().toLowerCase(), msg=$('#np_msg');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    msg.textContent='Enter a real email address first. Accounts cannot be created without one.';
    $('#np_email').focus(); return;
  }
  const tmpPw=($('#np_pw')?$('#np_pw').value:'').trim();
  if(tmpPw && tmpPw.length<8){ msg.textContent='A temporary password needs at least 8 characters.'; return; }
  try{
    const body={name:($('#np_name').value||'').trim(),email,role:$('#np_role').value};
    if(tmpPw){ body.password=tmpPw; body.must_change_pw=true; }
    const r=await api('/api/users','POST',body);
    msg.textContent = tmpPw
      ? `${email} can log in with the temporary password you set (they must change it at first login).`
      : (r.action==='created'?`Invite sent to ${email}.`:`${email} already had an account; it was updated and a fresh invite sent.`);
    setTimeout(adminPeople, 1600);
  }catch(e){ msg.textContent=e.data&&e.data.error||'Could not add them. Try again.'; }
}

  catch(e){ alert(e.data&&e.data.error||'Could not re-send.'); }
}

  $('#tab').innerHTML=`<h2>Platform <em>connections</em></h2>
    <p class="sub">${integrations.filter(i=>i.status==='connected').length} of ${integrations.length} connected. Posting is currently <b>${d.live?'LIVE':'dry-run (safe)'}</b>.</p>
    ${integrations.map(it=>`<div class="card"><div class="row"><div><h3>${esc(it.name)}</h3><div class="meta">${esc(it.method)}</div></div>${pill(it.status)}</div>
      ${it.id==='website'
        ? `<div class="meta" style="margin-top:8px">No keys needed. The Art Workshops page on theeverett.org embeds the app and shows every published class on its own.</div>`
        : `<div class="meta" style="margin-top:8px">API keys: <b style="color:${it.configured?'#3F7A32':'#B45309'}">${it.id==='descene'?'no API (manual)':(it.configured?'present':'missing')}</b></div>
      <button class="btn ${it.status==='connected'?'warn':'dark'}" style="margin-top:12px"

        ${it.status==='connected'?'Disconnect':'Connect'}</button>`}
      ${it.id==='eventbrite'?`<button class="btn ghost" style="margin-top:8px" onclick="testEventbrite()">Verify token &amp; get Org ID</button>`:''}</div>`).join('')}
    <div class="card"><div class="row"><div><h3>Google Calendar</h3><div class="meta">Open times become bookable slots · approved classes post back to the calendar</div></div></div>
      <button class="btn ghost" style="margin-top:10px" onclick="syncCalendar()">Sync open times now</button></div>

async function testEmail(){
  const r=await api('/api/test-email','POST',{});
  if(!r.live) alert('Email is still in DRY-RUN, so nothing was sent.\nAdd SMTP settings + EMAIL_LIVE=true to send for real.\n(Would have gone to '+r.to+' from '+r.from+'.)');
  else if(r.delivered) alert('Test email SENT to '+r.to+' from '+r.from+'.\nCheck your inbox (and spam).');
  else alert('Email is set live but the send FAILED (bad SMTP host/user/password, most likely).\nDouble-check the SMTP settings.');
}
async function toggleInteg(id,action){ await api('/api/integrations/'+id+'/'+action,'POST'); adminConnections(); }
async function syncCalendar(){
  const r=await api('/api/sync-calendar','POST',{});

  alert('Calendar synced!\n\nOpen slots now available: '+r.open+'\n(+'+r.added+' added, '+r.removed+' removed)');
}
/* ---------------- archive (soft-deleted records) ---------------- */
async function adminArchive(){
  const d = await api('/api/archive');
  const n = d.classes.length + d.slots.length + d.users.length;
  const row = (title, meta, table, id) => `<div class="card">
    <div class="row"><div><h3 style="font-size:1rem">${title}</h3><div class="meta">${meta}</div></div></div>
    <button class="btn ghost" style="margin-top:10px" onclick="restoreRecord('${table}',${id})">Restore</button></div>`;
  $('#tab').innerHTML = `<h2>Archive</h2>
    <p class="sub">${n} archived record${n===1?'':'s'}. Nothing is ever deleted from the database, so anything here can be brought back.</p>

    <label>Classes (${d.classes.length})</label>
    ${d.classes.map(c=>row(esc(c.title||('Class #'+c.id)),
      `${esc(c.instructor_name||'unknown instructor')} · ${esc(c.slot_date||'')} ${esc(c.slot_time||'')} · was ${esc(c.status)} · archived ${esc(c.deleted_at)}`,
      'classes', c.id)).join('') || '<div class="muted">No archived classes.</div>'}

    <label style="margin-top:18px">Instructors &amp; admins (${d.users.length})</label>
    ${d.users.map(u=>row(esc(u.name||u.email),
      `${esc(u.email)} · ${esc(u.role)} · archived ${esc(u.deleted_at)}`,
      'users', u.id)).join('') || '<div class="muted">No archived people.</div>'}

    <label style="margin-top:18px">Time slots (${d.slots.length})</label>
    ${d.slots.map(s=>row(`${esc(s.date)} · ${esc(s.start)} – ${esc(s.end)}`,
      `${esc(s.room||'no room')} · ${esc(s.status)} · from ${esc(s.source)} · archived ${esc(s.deleted_at)}`,
      'slots', s.id)).join('') || '<div class="muted">No archived slots.</div>'}`;
}
async function restoreRecord(table, id){
  await api(`/api/archive/${table}/${id}/restore`,'POST');
  adminArchive();
}
async function archiveRecord(table, id, what){
  if(!confirm(`Archive this ${what}?\n\nIt disappears from the app but is not deleted, and you can restore it from the Archive tab.`)) return;
  await api(`/api/archive/${table}/${id}/delete`,'POST');
  if(table==='classes') adminAll(); else adminArchive();
}

/* ---------------- money ---------------- */
const pct = n => (n*100).toFixed(0)+'%';
// whole pounds, and a minus sign that sits outside the currency symbol
const money0 = n => (n<0?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString();

      <div><b>${money0(t.pay)}</b><span>instructor pay</span></div>
      <div><b>${money0(t.materials)}</b><span>materials</span></div>
      <div><b class="${t.net>=0?'pos':'neg'}">${money0(t.net)}</b><span>net to The Gibby</span></div>
      <div><b>${pct(t.margin)}</b><span>margin</span></div>
      <div><b>${pct(t.fill)}</b><span>seats filled</span></div>
    </div>

    <label style="margin-top:18px">Best margin by class</label>
    <p class="sub" style="margin-top:2px">Which ideas are worth running again.</p>
    ${league(d.by_class,'run')}

    <label style="margin-top:20px">By instructor</label>
    <p class="sub" style="margin-top:2px">Fill rate is mostly what drives this, so read it alongside how the class was promoted.</p>
    ${league(d.by_instructor,'class')}

    <label style="margin-top:20px">Every class</label>
    <div style="overflow-x:auto">
    <table class="money"><thead><tr>
      <th>Class</th><th class="num">Booked</th><th class="num">Revenue</th>
      <th class="num">Pay</th><th class="num">Materials</th><th class="num">Net</th></tr></thead><tbody>
    ${d.classes.map(c=>`<tr>
      <td><b>${esc(c.title)}</b><div class="meta">${esc(c.slot_date||'')} &middot; ${esc(c.instructor||'')}${
        c.status==='cancelled'?' &middot; cancelled':(c.actual?'':' &middot; upcoming')}</div></td>
      <td class="num">${c.enrolled}/${c.planned}</td>
      <td class="num">${money0(c.revenue)}</td>
      <td class="num">${money0(c.instructor_pay)}<div class="meta">${c.pay_model==='split'
        ? '60% of sales'
        : ('flat' + (c.formula_pay!==c.instructor_pay ? ', 60% would be '+money0(c.formula_pay) : ''))}</div></td>
      <td class="num">${c.gibby_materials?money(c.gibby_materials):'&mdash;'}</td>
      <td class="num ${c.net>=0?'pos':'neg'}">${money0(c.net)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="hint" style="margin-top:12px">Pay follows each class's own deal: flat fee classes pay the
      agreed amount whatever the turnout, and split classes pay 60% of actual ticket sales after materials.

      not charged to The Gibby a second time.</div>`;

function snapPretty(s){ try{ const o=JSON.parse(s||'{}'); if(o.photo) o.photo='[image data omitted]'; return JSON.stringify(o,null,2); }catch(_){ return s||''; } }
function renderAuditRows(){
  const cid=$('#af_class').value, aid=$('#af_actor').value;
  let rows = window.__audit||[];
  if(cid) rows = rows.filter(e=>String(e.class_id)===cid);
  if(aid) rows = rows.filter(e=>(e.actor_id==null?'null':String(e.actor_id))===aid);
  const badge=s=>`<span class="pill ${s==='approved'?'appr':(s==='cancelled'||s==='incomplete')?'inc':'pend'}">${esc(s||'new')}</span>`;
  $('#auditrows').innerHTML = rows.map(e=>`
    <div class="card">
      <div class="row"><div><h3 style="font-size:1rem">${esc(e.class_title||('Class #'+e.class_id))}</h3>
        <div class="meta">${esc(e.ts)} · ${e.actor_id==null?'Automated (system)':esc(e.actor_name||e.actor_email||('User #'+e.actor_id))}</div></div>
        <div style="white-space:nowrap">${badge(e.prev_status)} <span style="opacity:.5">→</span> ${badge(e.new_status)}</div></div>
      <button class="btn ghost" style="margin-top:8px" onclick="this.nextElementSibling.classList.toggle('hidden')">View snapshot</button>
      <pre class="hidden" style="margin-top:8px;background:#f6f4ef;border-radius:12px;padding:12px;overflow:auto;font-size:.72rem;white-space:pre-wrap">${esc(snapPretty(e.snapshot))}</pre>
    </div>`).join('') || '<div class="muted">No entries match those filters.</div>';
}
async function testEventbrite(){
  const r=await api('/api/test-eventbrite','POST',{});
  if(!r.ok){ alert('Eventbrite check failed:\n'+r.error+'\n\nMake sure EVENTBRITE_TOKEN is set on the server.'); return; }
  const list=(r.organizations||[]).map(o=>o.name+'  —  Org ID: '+o.id).join('\n');
  const match = r.configured_org_id
    ? (r.org_id_matches ? '\n\nThe server\'s EVENTBRITE_ORG_ID ('+r.configured_org_id+') matches. Good.'
                        : '\n\nPROBLEM FOUND: the server\'s EVENTBRITE_ORG_ID is "'+r.configured_org_id+'", which is NOT one of your organizations. Fix it on Render, then retry the failed steps.')
    : '\n\nEVENTBRITE_ORG_ID is not set on the server yet.';
  alert('Token works! Your Eventbrite organization(s):\n\n'+(list||'(none found)')+match);
}

async function sendFeedback(id){
  const pick = k => { const el=$('#'+k+id); const on=el&&el.querySelector('.on'); return on?on.dataset.v:''; };
  await api('/api/classes/'+id+'/feedback','POST',{
    enrollment: pick('fbe'), materials: pick('fbm'), teach_again: pick('fba'),
    notes: $('#fbn'+id).value});
  alert('Thank you. That goes straight to The Gibby and helps shape next season.');
  instrMine();
}
async function saveFollowup(id, save){
  const note = $('#fu'+id).value;
  const r = await api('/api/classes/'+id+'/followup-note','POST',{note, save});
  alert(save ? 'Draft saved. Come back when you are ready.' : 'Sent to The Gibby for review.');
  instrMine();
}
async function sendFollowup(id){
  const r = await api('/api/classes/'+id+'/followup-send','POST',{note:$('#fa'+id).value});
  if(!r.ok){ alert('Not sent.\n\n'+r.reason); return; }
  alert(`Sent to ${r.sent_to} student${r.sent_to===1?'':'s'}.\n\n`
      + (r.attendance_known ? 'Only people who checked in received it.'
                            : 'Attendance was unknown, so it went to all ticket holders with neutral wording.'));
  adminApprovals();
}
async function returnFollowup(id){
  const note = prompt('What would you like changed? (the instructor sees this)');
  if(note===null) return;
  await api('/api/classes/'+id+'/followup-return','POST',{note});
  adminApprovals();
}

  r.onload = async e => {
    try{

/* ---------------- optimistic UI + pending lock ----------------
   The click locks the button immediately, before the request goes out, so a
   double-tap cannot fire twice. The server-side compare-and-swap and the
   publishing_in_progress flag are the real guards; this is the fast feedback. */
function btnFrom(ev){ return ev && (ev.currentTarget || (ev.target && ev.target.closest && ev.target.closest('button'))) || null; }
function lockButton(btn, label){
  if(!btn) return null;
  const restore = {html: btn.innerHTML, disabled: btn.disabled};
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>${esc(label)}`;
  // lock every sibling action on the same card so nothing else fires mid-flight
  const card = btn.closest('.card');
  const others = card ? [...card.querySelectorAll('button')].filter(b=>b!==btn && !b.disabled) : [];
  others.forEach(b=>b.disabled=true);
  return ()=>{ btn.innerHTML=restore.html; btn.disabled=restore.disabled; others.forEach(b=>b.disabled=false); };
}

const PUB_ICON = {done:'✓', failed:'⚠', skipped:'–', queued:'…', running:'…'};
function pubRowsHTML(platforms){
  if(!platforms.length) return '<div class="meta">Nothing queued yet.</div>';
  return platforms.map(p=>{
    const waiting = p.status==='queued'||p.status==='running';
    const detail = p.status==='failed' ? `<span class="er">${esc(p.error||'failed')}</span>`
      : p.status==='skipped' ? `<span class="meta">${esc(p.error||'not connected')}</span>`
      : p.status==='done' ? '' : `<span class="meta">${p.attempts?`retrying (attempt ${p.attempts+1})`:'waiting'}</span>`;
    return `<div class="pubrow ${waiting?'wait':''}"><span class="ic">${PUB_ICON[p.status]||'·'}</span>
      <b>${esc(p.label)}</b> ${detail}</div>`;
  }).join('');
}

/* Poll until the queue drains, then leave the final per-platform result on screen. */
let POLLS = {}, ADMIN_TAB=null;
let DRAFT_ID=null, PENDING_DRAFT=null;   // draft being edited / waiting for a new slot
async function pollPublish(id, tries){
  const host = $('#pubstat'+id);
  if(!host) return;                                  // card re-rendered; stop quietly
  let r;
  try{ r = await api(`/api/classes/${id}/publish-status`); }
  catch(_){ return; }
  if(!$('#pubstat'+id)) return;
  const failed = r.platforms.filter(p=>p.status==='failed');
  $('#pubstat'+id).innerHTML =
    `<div class="meta" style="font-weight:800">${r.publishing ? 'Publishing…'
      : failed.length ? `${failed.length} step${failed.length===1?' needs':'s need'} attention`
      : 'All steps finished'}</div>` + pubRowsHTML(r.platforms);
  if(r.publishing && tries > 0){
    POLLS[id] = setTimeout(()=>pollPublish(id, tries-1), 2000);
  } else {
    delete POLLS[id];
    // Refresh the approvals queue so the finished card moves on, but only if that
    // is the tab the admin is actually looking at. Never yank them somewhere else.
    if(!r.publishing && ADMIN_TAB==='approvals'){
      setTimeout(()=>{ if(ADMIN_TAB==='approvals' && $('#pubstat'+id)) adminApprovals(); }, 2500);
    }
  }
}
function startPublishPolling(id){
  clearTimeout(POLLS[id]);
  pollPublish(id, 40);                               // ~80s of live updates, then it settles
}

/* If another admin decided first the server answers 409 with a friendly line.
   Show exactly that and refresh the queue so the stale card disappears. */
async function decideClass(id, path, body){
  try{
    await api(`/api/classes/${id}/${path}`,'POST',body);
  }catch(e){
    if(e.data && e.data.status){ alert(e.message); adminApprovals(); return false; }
    throw e;
  }
  adminApprovals(); return true;
}
async function approve(id, ev){
  // Approve builds the poster; it does NOT post to the platforms (that is Publish).
  const undo = lockButton(btnFrom(ev), 'Building the poster…');
  try{
    const ok = await decideClass(id,'approve');
    if(!ok && undo) undo();
  }catch(e){ if(undo) undo(); throw e; }

/* Month calendar for picking a class date: one real month at a time, paged with
   arrows. Days with open times are green and tappable (the little number is how
   many 30-minute times are free); everything else is dimmed. Tapping a day shows
   its times below. */
function calendarPickerHTML(slots){
  const byDay={}; slots.forEach(s=>{ (byDay[s.date]=byDay[s.date]||[]).push(s); });
  const months=[...new Set(Object.keys(byDay).map(d=>parseDate(d)).filter(Boolean).map(p=>p.m))]
    .sort((a,b)=>mOrd(a)-mOrd(b));
  if(!months.length) return '<div class="muted">No open days right now.</div>';
  let m=CAL_PAGE;
  if(m===null || !months.includes(m)){
    const sd=parseDate(SLOTDAY);
    m = (sd && months.includes(sd.m)) ? sd.m : months[0];
  }
  const y=seasonYearFor(m), idx=months.indexOf(m);
  const openByNum={};
  Object.keys(byDay).forEach(d=>{ const p=parseDate(d); if(p && p.m===m) openByNum[p.d]={label:d, n:byDay[d].length}; });
  const lead=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="calday"></div>';
  for(let d=1;d<=dim;d++){
    const o=openByNum[d];
    cells += o
      ? `<button class="calday has ${o.label===SLOTDAY?'on':''}" onclick="pickDay('${o.label}')"><span>${d}</span><small>${o.n}</small></button>`
      : `<div class="calday off"><span>${d}</span></div>`;
  }
  return `<div class="cal">
    <div class="calhead">
      <button class="calnav" ${idx===0?'disabled':''} onclick="setCalPage(${idx===0?m:months[idx-1]})" aria-label="earlier month">‹</button>
      <div class="calmon">${MONNAME[m]} ${y}</div>
      <button class="calnav" ${idx===months.length-1?'disabled':''} onclick="setCalPage(${idx===months.length-1?m:months[idx+1]})" aria-label="later month">›</button>
    </div>
    ${months.length>1?`<div class="calmonths">${months.map(mm=>`<button class="${mm===m?'on':''}" onclick="setCalPage(${mm})">${MONNAME[mm].slice(0,3)} ’${String(seasonYearFor(mm)).slice(2)}</button>`).join('')}</div>`:''}
    <div class="caldow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="calgrid">${cells}</div>
    <div class="callegend">Green days have open times. Tap one to see them.</div>
  </div>`;
}

function pickDay(d){ SLOTDAY=d; SEL=[]; instrOpen(); }
function toggleSlot(id){
  const s=DAYSLOTS.find(x=>x.id===id);
  if(SEL.length===0){ SEL=[id]; }
  else if(SEL.includes(id)){
    const sel=SEL.map(x=>DAYSLOTS.find(y=>y.id===x)).sort((a,b)=>tmin(a.start)-tmin(b.start));
    const first=sel[0], last=sel[sel.length-1];
    SEL = (id===first.id||id===last.id) ? SEL.filter(x=>x!==id) : [id];
  } else {
    // Tap a start, tap an end: everything between fills in, as long as the whole
    // stretch is open with no busy gap. A tap across a gap starts fresh instead.
    const sel=SEL.map(x=>DAYSLOTS.find(y=>y.id===x)).sort((a,b)=>tmin(a.start)-tmin(b.start));
    const lo=Math.min(tmin(sel[0].start), tmin(s.start));
    const hi=Math.max(tmin(sel[sel.length-1].end), tmin(s.end));
    const range=DAYSLOTS.filter(x=>x.room===s.room && tmin(x.start)>=lo && tmin(x.end)<=hi)
                        .sort((a,b)=>tmin(a.start)-tmin(b.start));
    const contiguous = range.length>0
      && tmin(range[0].start)===lo && tmin(range[range.length-1].end)===hi
      && range.every((x,i)=>i===0 || tmin(range[i-1].end)===tmin(x.start));
    SEL = contiguous ? range.map(x=>x.id) : [id];
  }
  SERIES_PREVIEW=null;
  if(CLASSKIND==='series' && SEL.length) return previewSeries();   // re-checks open weeks, then redraws
  instrOpen();
}

function confirmSel(){

  const series = CLASSKIND==='series';
  if(series && (!SERIES_PREVIEW || !SERIES_PREVIEW.sessions || SERIES_PREVIEW.sessions.length<2)){
    alert('Not enough open weeks for a series from that date. Try a different start, or fewer weeks.');
    return;

  // Never silently shorten a course: if the calendar cannot fit the requested run,
  // say so plainly and make them choose.

      + `(ending ${SERIES_PREVIEW.sessions[SERIES_PREVIEW.sessions.length-1].date}).\n\n`
      + `Book it as a ${SERIES_PREVIEW.found}-week course?\n\nCancel to pick a different start date or fewer weeks.`);
    if(!ok) return;
  }
  if(RESCHED){
    const ws=sel[0].start, we=sel[sel.length-1].end;
    window.__RS_IDS = SEL.slice();
    closeResched();
    const m=document.createElement('div'); m.id='rsmodal';

async function resumeDraft(id){

  set('#f_title',p.title); set('#f_desc',p.description); set('#f_len',p.length);

  set('#c_mat',p.material_cost); set('#f_room',p.room); set('#f_close',p.close_days);

function fmtT(m){ let h=Math.floor(m/60), mm=m%60; const ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+String(mm).padStart(2,'0')+' '+ap; }
function timeOpts(ws, we, which){
  const a=tmin(ws), b=tmin(we);
  // suggest 30 min inside each end when there is room for a real class between
  const defStart = (b-a>=90) ? a+30 : a;
  const defEnd   = (b-a>=90) ? b-30 : b;
  let out='';
  for(let m=a; m<=b; m+=30){
    const sel = (which==='start' ? m===defStart : m===defEnd) ? ' selected' : '';
    out+=`<option${sel}>${fmtT(m)}</option>`;
  }
  return out;
}

async function videoPick(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(f.size > 80*1024*1024){ alert('That video is '+Math.round(f.size/1048576)+'MB; the limit is 80MB. Trim it or export it smaller.'); return; }
  const st=$('#vstat'); st.textContent='Uploading your video\u2026 ('+Math.round(f.size/1048576)+'MB, this can take a minute)';
  try{
    const r=await fetch('/api/upload-video',{method:'POST',
      headers:{'X-CSRF-Token':CSRF,'Content-Type':f.type||'video/mp4'}, body:f});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'upload failed');
    VIDEO_URL=j.url; videoStatus();
  }catch(e){ st.textContent=''; alert('Could not upload the video.\n\n'+e.message); }

    const n=$('#draftnote'); if(n) n.textContent='Resubmitting: fix what was flagged, then submit.'; }
  initFormHelpers();
}
// Under-14 groups trigger the "do you need a volunteer assistant?" question.
const KID_AGES=['Ages 2–4','Ages 5–7','Ages 8–10','Ages 11–14'];
function selectedAges(){ return [...document.querySelectorAll('#f_ages input:checked')].map(x=>x.value); }
/* Mirrors age_label() on the server so the instructor sees the exact phrase that
   will appear on Eventbrite and the poster, not the raw checkbox list. */
function ageBounds(s){
  if(!s) return null;
  if(/^all/i.test(s.trim())) return [0,200];
  const n=(s.match(/\d+/g)||[]).map(Number);
  if(!n.length) return null;
  if(s.includes('+')) return [n[0],200];
  return n.length>1?[n[0],n[1]]:[n[0],n[0]];
}
function ageLabel(list){
  if(!list.length) return '';
  if(list.some(a=>/^all/i.test(a))) return 'All ages';
  const spans=list.map(ageBounds).filter(Boolean).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(!spans.length) return list.join(', ');
  const m=[spans[0].slice()];
  for(const [lo,hi] of spans.slice(1)){
    if(lo<=m[m.length-1][1]+1) m[m.length-1][1]=Math.max(m[m.length-1][1],hi);
    else m.push([lo,hi]);
  }
  return 'Ages '+m.map(([lo,hi])=>hi>=200?`${lo}+`:(lo===hi?`${lo}`:`${lo}–${hi}`)).join(' & ');
}
function ageChanged(){
  const sel=selectedAges();
  const kid=sel.some(a=>KID_AGES.includes(a));
  $('#f_volwrap').classList.toggle('hidden', !kid);
  const p=$('#f_agepreview');
  if(p) p.textContent = sel.length ? `Will appear as: ${ageLabel(sel)}` : '';
}
function alcSel(b){ segPick(b);
  if(b.dataset.v==='yes'){ const c=document.querySelector('#f_ages input[value="Ages 21+"]'); if(c){c.checked=true; ageChanged();} } }
function onPhoto(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=ev=>{PHOTO=ev.target.result; $('#f_photo').innerHTML='<img src="'+PHOTO+'">';}; r.readAsDataURL(f); }
let CALC_DIR='pay';   // which end the instructor is working from: 'pay' or 'ticket'
function calc(dir){
  if(dir) CALC_DIR=dir;
  const plan=Math.max(1,+$('#c_plan').value||1), mat=+$('#c_mat').value||0;
  const own=$('#f_own') && $('#f_own').checked;
  const reimb = own ? mat*plan : 0;             // instructor providing materials -> reimbursed
  const free=$('#f_free') && $('#f_free').checked;
  const fn=$('#freenote');
  if(fn){
    fn.style.display = free ? '' : 'none';
    fn.textContent = free
      ? (own ? `Thank you! Ticket sales go to The Gibby. You are still reimbursed ${money(reimb)} for the materials you provide.`
             : 'Thank you! All ticket sales for this class go to The Gibby.')
      : '';
  }
  if($('#f_pay')) $('#f_pay').disabled = !!free;
  if($('#c_pay')) $('#c_pay').disabled = !!free;
  if(free){
    if($('#c_pay')) $('#c_pay').value = 0;
    const ticket=+$('#f_ticket').value||0;
    if($('#f_pay')){ $('#f_pay').value = Math.round(reimb); delete $('#f_pay').dataset.t; }
    $('#o_t').textContent=money(ticket); $('#o_p').textContent=money(reimb);
    const lab=$('#o_tlab');
    if(lab && lab.firstChild && lab.firstChild.nodeType===3) lab.firstChild.textContent='Your ticket';
    const note=$('#matnote');
    if(note) note.textContent = own
      ? `You're providing materials, so ${money(reimb)} (materials for ${plan} students) is reimbursed to you.`
      : 'The Gibby provides materials; the ticket price covers them.';
    return;
  }
  let ticket;
  if(CALC_DIR==='ticket'){
    // They typed a ticket price: work the pay out from it.
    ticket = +$('#f_ticket').value||0;
    const pool=Math.max(0,(ticket-mat)*plan);
    if($('#c_pay')) $('#c_pay').value=Math.round(pool*0.6);
  } else {
    // They typed the pay they want: recommend a ticket for it.
    const pay=+$('#c_pay').value||0;
    ticket=Math.ceil(mat + (pay/0.6)/plan);
    if($('#f_ticket')) $('#f_ticket').value=ticket;
  }
  const pool=Math.max(0,(ticket-mat)*plan);
  const yourPay = pool*0.6 + reimb;
  $('#o_t').textContent=money(ticket); $('#o_p').textContent=money(yourPay);
  const lab=$('#o_tlab');
  if(lab) lab.firstChild && lab.firstChild.nodeType===3
    ? lab.firstChild.textContent=(CALC_DIR==='ticket'?'Your ticket':'Recommended ticket')
    : null;
  const note=$('#matnote');
  if(note) note.textContent = own
    ? `You're providing materials, so ${money(reimb)} (materials for ${plan} students) is added to your pay.`
    : 'The Gibby provides materials; the ticket price covers them.';
  if($('#f_pay') && !$('#f_pay').dataset.t)$('#f_pay').value=Math.round(yourPay);
}
function wordCount(s){ return (s||'').trim().split(/\s+/).filter(Boolean).length; }
function descCount(){ const n=wordCount($('#f_desc').value); const el=$('#f_desccount');
  if(el){ el.textContent=n+' / 50 words'+(n>=50?' ✓':''); el.style.color=n>=50?'#3F7A32':'var(--ink-soft)'; } }
function validateForm(){
  /* Each missing item carries the element to mark and jump to, so a failed submit
     lands the instructor ON the gap instead of a list at the top of the page. */
  const miss=[];
  const num=id=>{ const v=$('#'+id).value; return v.trim()===''?null:+v; };
  const add=(sel,label,short)=>miss.push({sel,label,short});
  if(!$('#f_title').value.trim()) add('#f_title','Class title','title');
  const dw=wordCount($('#f_desc').value);
  if(dw<50) add('#f_desc','Description (at least 50 words'+(dw?', currently '+dw:'')+')','description');
  if(!$('#f_len').value) add('#f_len','Class length','length');
  const cs2=$('#f_cstart'), ce2=$('#f_cend');
  if(cs2 && ce2 && tmin(cs2.value) >= tmin(ce2.value))
    add('#f_cend','Class end time must be after it starts','class times');
  if(selectedAges().length===0) add('#f_ages','At least one age range','ages');
  if(!PHOTO) add('#f_photo','A class photo','photo');
  const max=num('f_max'), min=num('f_min');
  if(!(max>0)) add('#f_max','Max students','max');
  if(!(min>0)) add('#f_min','Min students','min');
  if(max>0 && min>0 && min>max) add('#f_min','Min students can’t be more than Max','min vs max');
  const mat=num('c_mat');
  if(mat===null || mat<0) add('#c_mat','Material cost per student','materials');
  const ticket=num('f_ticket'), pay=num('f_pay');
  const donation=$('#f_donate')&&$('#f_donate').checked;
  if(!donation && !(ticket>0)) add('#f_ticket','Ticket price','ticket');
  if(!($('#f_free')&&$('#f_free').checked) && !(pay>0)) add('#f_pay','Your pay','pay');
  return miss;
}
function donateToggle(){
  const on=$('#f_donate')&&$('#f_donate').checked, t=$('#f_ticket');
  if(t){ t.disabled=!!on; if(on) t.value=''; }
  calc();
}
let SUBMIT_TRIED=false, AUTOSAVE_T=null;
function markMissing(miss){
  document.querySelectorAll('#view .missfield').forEach(el=>el.classList.remove('missfield'));
  miss.forEach(m=>{ const el=$(m.sel); if(el) el.classList.add('missfield'); });
}
function jumpToFirst(miss){
  const el=miss.length && $(miss[0].sel);
  if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); if(el.focus) el.focus({preventScroll:true}); }
}
/* The what's-left bar: lives above the submit buttons, ticks down as they go, and
   tapping it jumps to the first gap. */
function updateTodo(){
  const bar=$('#todobar'); if(!bar || !$('#f_title')) return;
  const miss=validateForm();
  if(SUBMIT_TRIED) markMissing(miss);
  if(!miss.length){
    bar.className='ok'; bar.innerHTML='Ready to submit \u2713'; bar.onclick=null;
  } else {
    const shorts=miss.map(m=>m.short);
    bar.className=''; bar.onclick=()=>jumpToFirst(miss);
    bar.innerHTML='<span class="cnt">'+miss.length+'</span> Still needed: '
      + esc(shorts.slice(0,3).join(', ')) + (shorts.length>3?' +'+(shorts.length-3)+' more':'');
  }
}
function scheduleAutosave(){
  clearTimeout(AUTOSAVE_T);
  AUTOSAVE_T=setTimeout(async ()=>{
    if(!$('#f_title')) return;                       // form was closed
    const f=collectForm();
    if(!((f.title||'').trim() || (f.description||'').trim() || f.photo)) return;
    try{
      await saveDraft(true);
      const n=$('#draftnote');
      if(n) n.textContent='Draft saved automatically at '
        + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) + '.';
    }catch(_){/* autosave never nags */}
  }, 25000);
}
function initFormHelpers(){
  SUBMIT_TRIED=false;
  const v=$('#view'); if(!v) return;
  v.addEventListener('input', ()=>{ updateTodo(); scheduleAutosave(); });
  v.addEventListener('change', ()=>{ updateTodo(); scheduleAutosave(); });
  v.addEventListener('click', e=>{
    if(e.target.closest('.seg,.chk,.photo,select')) setTimeout(()=>{ updateTodo(); scheduleAutosave(); },0);
  });
  updateTodo();
}
/* Read the form exactly once, so a draft saves precisely what would be submitted.
   Tolerates a half-filled form: nothing here validates. */
function collectForm(){
  const seg = id => { const s=$(id); const on = s && s.querySelector('.on'); return on ? on.dataset.v : 'no'; };
  const ages = selectedAges();
  const kid = ages.some(a=>KID_AGES.includes(a));
  return {
    title:$('#f_title').value, description:$('#f_desc').value,
    age_range: ages.join(', '), length:$('#f_len').value, pre_class:$('#f_pre').value,
    needs_volunteer: kid && seg('#f_vol')==='yes',
    own_materials: $('#f_own').checked, material_cost:+$('#c_mat').value,
    alcohol: seg('#f_alc')==='yes', max_p:+$('#f_max').value, min_p:+$('#f_min').value,
    ticket_price:+$('#f_ticket').value, instructor_pay:+$('#f_pay').value,
    waives_pay: !!($('#f_free')&&$('#f_free').checked),
    donation_based: !!($('#f_donate')&&$('#f_donate').checked),
    resubmit_of: RESUB_OLD_ID||undefined,
    links:$('#f_links').value, video:VIDEO_URL, faq:collectFaq(), photo:PHOTO, close_days:+($('#f_close')?$('#f_close').value:0),
    pay_model:(()=>{const g=$('#f_paym');const on=g&&g.querySelector('.on');return on?on.dataset.v:'flat';})(),
    class_start:($('#f_cstart')?$('#f_cstart').value:''), class_end:($('#f_cend')?$('#f_cend').value:''),
    slot_ids:SUBMIT_SLOT.ids, slot_date:SUBMIT_SLOT.date,
    room:($('#f_room')?$('#f_room').value:SUBMIT_SLOT.room),
    is_series: !!SUBMIT_SLOT.series, session_count: SUBMIT_SLOT.weeks||1,
    supplies:[]
  };
}
/* Their own submitted classes, newest first, one entry per title. Repeat
   instructors mostly reuse their numbers, so a rerun should be a copy, not a
   retype. */
let PREV_CLASSES=[];
async function loadPrevOptions(){
  try{
    const {classes} = await api('/api/classes/mine');
    const seen=new Set(); PREV_CLASSES=[];
    classes.forEach(c=>{ if(!seen.has(c.title)){ seen.add(c.title); PREV_CLASSES.push(c); } });
    const sel=$('#f_prev');
    if(sel && PREV_CLASSES.length){
      sel.innerHTML='<option value="">Pick one&hellip;</option>'
        + PREV_CLASSES.map((c,i)=>`<option value="${i}">${esc(c.title)}</option>`).join('');
    } else if(sel){ sel.closest('div').style.display='none'; }
  }catch(_){/* the picker is a convenience; the form works without it */}
}
function applyPrev(){
  const i=$('#f_prev').value; if(i==='') return;
  const c=PREV_CLASSES[+i]; if(!c) return;
  applyDraft(c);                       // same keys as a draft payload
  updateTodo();
  const n=$('#draftnote');
  if(n) n.textContent=`Copied from ${c.title}. The date and class times are fresh for this booking.`;
}
async function saveDraft(silent){
  const payload = collectForm();
  const r = await api('/api/drafts','POST',{
    id: DRAFT_ID || undefined, payload,
    slot_ids: payload.slot_ids, slot_date: payload.slot_date,
    slot_time: SUBMIT_SLOT.time, room: payload.room,
    is_series: payload.is_series, session_count: payload.session_count});
  DRAFT_ID = r.id;
  const n = $('#draftnote');
  if(n) n.textContent = 'Draft saved. You can close this and come back to it from My classes.';
  if(!silent) return r;
}
async function submitClass(){
  const miss=validateForm();
  if(miss.length){
    SUBMIT_TRIED=true; markMissing(miss); updateTodo();
    const x=$('#ferr'); x.textContent='Please complete: '+miss.map(m=>m.label).join(', ')+'.'; x.classList.add('show');
    jumpToFirst(miss); return; }
  showReview();
}
/* The last look before it goes to The Gibby: everything they are agreeing to on
   one card. Only reachable once the form is complete. */
function showReview(){
  const f = collectForm();
  const when = SUBMIT_SLOT.series
    ? `${SUBMIT_SLOT.weeks} weeks &middot; ${esc(SUBMIT_SLOT.sessions[0].date)} &ndash; ${esc(SUBMIT_SLOT.sessions[SUBMIT_SLOT.sessions.length-1].date)}`
    : esc(SUBMIT_SLOT.date);
  const planned = +$('#c_plan').value || f.max_p;
  const mat = (+f.material_cost||0), tk = (+f.ticket_price||0);
  const pool = Math.max(0, tk*planned - mat*planned);
  const earn = f.waives_pay
    ? `${money(f.instructor_pay)} \u00b7 you're donating your time${f.own_materials?' (materials reimbursed)':''} \u2764\ufe0f`
    : f.pay_model==='split'
    ? `about ${money0(pool*0.6 + (f.own_materials?mat*planned:0))} at ${planned} booked (60% of sales)`
    : `${money(f.instructor_pay)} flat`;
  const m = document.createElement('div'); m.id='rvmodal';
  m.style.cssText='position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML = `<div style="background:#FFFDF8;border-radius:18px;max-width:420px;width:100%;padding:20px 22px">
    <h2 style="margin:0 0 2px">One last <em>look</em></h2>
    <p class="sub" style="margin:0 0 12px">This is what The Gibby reviews and what students will see.</p>
    <div class="rvrow"><b>Class</b><span>${esc(f.title)}</span></div>
    <div class="rvrow"><b>When</b><span>${when} &middot; class ${esc(f.class_start)} &ndash; ${esc(f.class_end)}</span></div>
    <div class="rvrow"><b>Room</b><span>${esc(f.room)} &middot; booked ${esc(SUBMIT_SLOT.start)} &ndash; ${esc(SUBMIT_SLOT.end)}</span></div>
    <div class="rvrow"><b>Ages</b><span>${esc(ageLabel(selectedAges()))}</span></div>
    <div class="rvrow"><b>Students</b><span>${f.min_p} to ${f.max_p}${f.close_days?` &middot; registration closes ${f.close_days} day${f.close_days===1?'':'s'} before`:''}</span></div>
    <div class="rvrow"><b>Ticket</b><span>${money(f.ticket_price)}${f.own_materials?` &middot; you supply materials (${money(f.material_cost)}/student, reimbursed)`:''}</span></div>
    <div class="rvrow"><b>You earn</b><span>${earn}</span></div>
    <div class="two" style="margin-top:16px">
      <button class="btn ghost" onclick="closeReview()">Keep editing</button>
      <button class="btn dark" onclick="submitClassNow()">Yes, submit it</button></div></div>`;
  m.addEventListener('click', e=>{ if(e.target===m) closeReview(); });
  document.body.appendChild(m);
}
function closeReview(){ const m=$('#rvmodal'); if(m) m.remove(); }
async function submitClassNow(){
  closeReview();
  const body = {...collectForm(), draft_id: DRAFT_ID || undefined};
  try{ await api('/api/classes','POST',body); SEL=[]; DRAFT_ID=null; renderInstr('mine'); }
  catch(e){ const x=$('#ferr'); x.textContent=(e.data&&e.data.fields?('Missing: '+e.data.fields.join(', ')):e.message); x.classList.add('show'); window.scrollTo(0,0); }
}
